// Paquet de cartes : la carte choisie devant, les autres empilees derriere.
// Carte choisie au centre, la suivante derriere a droite, la precedente derriere a gauche. Le paquet tourne dans le sens du glisser.
var deck=null;
function initDeck(car,idx,onPick){
  var cards=car.children;
  deck={car:car,cards:cards,n:cards.length,pos:idx,drag:null,onPick:onPick||null};
  deckLayout();
  setTimeout(function(){ car.classList.add('anim'); },30);
  if(deck.n<2) return;
  car.onpointerdown=function(e){
    if(e.button>0) return;
    deck.drag={x:e.clientX,y:e.clientY,pos:deck.pos,dx:0,live:false};
  };
  car.onpointermove=function(e){
    var dr=deck.drag; if(!dr) return;
    dr.dx=e.clientX-dr.x;
    if(!dr.live){
      if(Math.abs(e.clientY-dr.y)>Math.abs(dr.dx)&&Math.abs(e.clientY-dr.y)>8){ deck.drag=null; return; }
      if(Math.abs(dr.dx)<6) return;
      dr.live=true; car.classList.remove('anim');
      try{ car.setPointerCapture(e.pointerId); }catch(err){}
    }
    deck.pos=dr.pos-dr.dx/cards[0].offsetWidth;
    deckLayout();
  };
  car.onpointerup=car.onpointercancel=function(){
    var dr=deck.drag; deck.drag=null; if(!dr||!dr.live) return;
    var target=Math.round(deck.pos);
    if(target===dr.pos&&Math.abs(dr.dx)>30) target=dr.pos+(dr.dx<0?1:-1);
    car.classList.add('anim');
    deck.pos=target; deckLayout();
  };
}
function deckLayout(){
  var n=deck.n;
  for(var i=0;i<n;i++){
    var t=((i-deck.pos)%n+n)%n, el=deck.cards[i];
    if(t>n/2) t-=n;
    var a=Math.abs(t), side=Math.min(a,1.5)*(t<0?-1:1);
    el.style.transform='translateX('+(side*24)+'%) scale('+(1-0.12*Math.min(a,1.5))+')';
    el.style.opacity=Math.max(0,Math.min(1,(1.5-a)*2));
    el.style.zIndex=100-Math.round(a*10);
  }
  var cur=((Math.round(deck.pos)%n)+n)%n;
  if(deck.onPick) deck.onPick(cur); else expShowAcc(cur);
}
function expShowAcc(idx){
  var dots=document.getElementById('expDots').children;
  var acc=findAccount(deck.cards[idx].getAttribute('data-id'));
  E[E.pick]=acc.id;
  for(var i=0;i<dots.length;i++) dots[i].classList.toggle('on',i===idx);
  document.getElementById('expAccName').textContent=accLabel(acc);
  document.getElementById('expAccBal').innerHTML=moneyHtml(accountBalance(acc))+S(accCur(acc));
}

// Echeances d un mois : une par operation reguliere, confirmee si une transaction porte son rec_key
function occurrences(y,m){

  for(var t=0;t<txns.length;t++){ if(txns[t].rec_key) done[txns[t].rec_key]=txns[t]; }

    for(var j=0;j<days.length;j++){

// Dates de paie d un revenu regulier (date reelle si confirmee, sinon date prevue), de m-3 a m+3
function payDates(rid,y,m){
  var r=getRecurring().filter(function(x){ return String(x.id)===String(rid); })[0]; if(!r) return [];
  var done={}, txns=getTxns(), today=todayStr(), last=payLastDone(r.id);
  for(var i=0;i<txns.length;i++){ var k=txns[i].rec_key; if(k&&k.indexOf(r.id+'@')===0) done[k]=txns[i].date; }
  var out=[];
  for(var dm=-3;dm<=3;dm++){
    var d=new Date(y,m+dm,1), yy=d.getFullYear(), mm=d.getMonth(), days=recDays(r,yy,mm), monthly=(r.freq||'month')==='month';
    for(var j=0;j<days.length;j++){
      var ds=mPrefix(yy,mm)+'-'+pad(days[j]), key=r.id+'@'+(monthly?mKey(yy,mm):ds);
      // paie prevue deja passee mais pas encore confirmee : elle n a pas encore eu lieu, au plus tot demain
      // (seulement apres la derniere paie confirmee : l historique ancien reste tel quel)
      out.push(done[key]||(last&&ds>last&&ds<=today?addDays(today,1):ds));
    }
  }
  return out.sort().filter(function(x,i,a){ return i===0||x!==a[i-1]; });
}
// Date de la derniere paie confirmee d un revenu regulier
function payLastDone(rid){ var l=''; getTxns().forEach(function(t){ if(t.rec_key&&t.rec_key.indexOf(rid+'@')===0&&t.date>l) l=t.date; }); return l; }
// Une paie prevue est passee sans etre confirmee : le mois en cours attend sa confirmation
function payWaiting(rid){
  var last=payLastDone(rid); if(!last) return null;
  var r=getRecurring().filter(function(x){ return String(x.id)===String(rid); })[0]; if(!r) return null;
  var today=todayStr(), d=parseDs(today), occ=[];
  for(var dm=-2;dm<=0;dm++){ var x=new Date(d.getFullYear(),d.getMonth()+dm,1); occ=occ.concat(occurrences(x.getFullYear(),x.getMonth())); }
  return occ.filter(function(o){ return String(o.r.id)===String(rid)&&!o.done&&o.date>last&&o.date<=today; })[0]||null;
}
// Mois de paie qui contient une date : de la paie a la veille de la paie suivante
function payRangeAt(rid,ds){
  var d=parseDs(ds), pd=payDates(rid,d.getFullYear(),d.getMonth()), st=null, nx=null;
  for(var i=0;i<pd.length;i++){ if(pd[i]<=ds) st=pd[i]; else { nx=pd[i]; break; } }
  if(!st) return null;
  var r={start:st,end:nx?addDays(nx,-1):addDays(st,30),pay:true};
  if(r.end===todayStr()&&payWaiting(rid)) r.waiting=true;
  return r;
}
// Mois de paie "du mois m" : celui qui commence par la paie tombee en mois m
function payRangeOfMonth(rid,y,m){
  var pd=payDates(rid,y,m), pre=mPrefix(y,m);
  for(var i=0;i<pd.length;i++){ if(pd[i].indexOf(pre)===0) return {start:pd[i],end:pd[i+1]?addDays(pd[i+1],-1):addDays(pd[i],30),pay:true}; }
  return null;
}
// Mois de paie commun aux comptes filtres (s ils suivent tous la meme paie), sinon null
// Mois a jours fixes choisis dans le calendrier : cycle "r:debut:fin" (ex. r:28:27 = du 28 au 27 du mois suivant)
function fixedParts(c){ var p=String(c).split(':'); return {s:parseInt(p[1],10)||1,e:parseInt(p[2],10)||31}; }
function fixedRangeFrom(c,y,m){
  var f=fixedParts(c), st=new Date(y,m,Math.min(f.s,daysIn(y,m)));
  var ey=y, em=f.e<f.s?m+1:m, en=new Date(ey,em,1); en=new Date(en.getFullYear(),en.getMonth(),Math.min(f.e,daysIn(en.getFullYear(),en.getMonth())));

}
// Melange de deux paies, cycle "mix:A:B" : le mois va de la paie A (ex. Etienne le 28 sept) a la veille de la paie B
// qui suit celle comprise dans le mois (ex. Noa le 5 oct, puis le 5 nov) : du 28 sept au 4 nov. Les mois se chevauchent.
function isMix(c){ return String(c).indexOf('mix:')===0; }
function mixParts(c){ var p=String(c).split(':'); return {a:p[1],b:p[2]}; }
function mixRanges(c,y,m){
  var p=mixParts(c), pa=payDates(p.a,y,m), pb=payDates(p.b,y,m), out=[], today=todayStr();
  for(var i=0;i<pb.length;i++){
    var B=pb[i], A=null;
    for(var j=0;j<pa.length;j++){ if(pa[j]<=B&&(i===0||pa[j]>pb[i-1])) A=pa[j]; }
    if(!A) continue;
    var r={start:A,end:pb[i+1]?addDays(pb[i+1],-1):addDays(B,30),pay:true,mix:true,anchor:B};
    if(r.end===today&&payWaiting(p.b)) r.waiting=true;

function mixRangeAt(c,ds){
  var d=parseDs(ds), rs=mixRanges(c,d.getFullYear(),d.getMonth()).filter(function(r){ return r.start<=ds; });
  return rs.length?rs[rs.length-1]:null;
}
function cycleRangeAt(c,ds){
  if(isMix(c)) return mixRangeAt(c,ds);
  if(String(c).indexOf('r:')!==0) return payRangeAt(c,ds);
  var d=parseDs(ds), r=fixedRangeFrom(c,d.getFullYear(),d.getMonth());
  if(r.start>ds){ var p=new Date(d.getFullYear(),d.getMonth()-1,1); r=fixedRangeFrom(c,p.getFullYear(),p.getMonth()); }
  return r;
}
// Le mois personnalise "d octobre" est celui qui contient le 15 octobre (ex. du 28 sept au 27 oct)
// Mois de paie : la periode « d octobre » est celle qui se termine en octobre (ex. du 28 sept au 27 oct,
// ou du 28 sept a aujourd hui tant que la paie suivante n est pas confirmee)
function cycleRangeOfMonth(c,y,m){
  if(String(c).indexOf('r:')===0) return cycleRangeAt(c,mPrefix(y,m)+'-15');
  if(isMix(c)){ var pre0=mPrefix(y,m); return mixRanges(c,y,m).filter(function(r){ return r.anchor.indexOf(pre0)===0; })[0]||mixRangeAt(c,pre0+'-15'); }
  var pd=payDates(c,y,m), pre=mPrefix(y,m), today=todayStr();
  for(var i=0;i<pd.length;i++){
    var end=pd[i+1]?addDays(pd[i+1],-1):addDays(pd[i],30);
    if(end.indexOf(pre)===0){ var r={start:pd[i],end:end,pay:true}; if(end===today&&payWaiting(c)) r.waiting=true; return r; }
  }
  return payRangeAt(c,pre+'-15');
}
// Mois (y,m) a afficher pour la periode en cours d un cycle
function cycleMonthNow(c){ var r=cycleRangeAt(c,todayStr()); if(!r) return null; return r.mix?parseDs(r.anchor):r.pay?parseDs(r.end):parseDs(addDays(r.start,14)); }
function cycleLabel(c){
  if(!c) return 'Calendaire (du 1er au 31)';
  if(String(c).indexOf('r:')===0){ var f=fixedParts(c); return f.s===1&&f.e>=28?'Calendaire (du 1er au 31)':'Du '+f.s+' au '+f.e+(f.e<f.s?' du mois suivant':''); }
  if(isMix(c)){ var mp=mixParts(c), ra=payById(mp.a), rb=payById(mp.b); return ra&&rb?'Les deux paies : '+ra.label+' → veille de '+rb.label:'Calendaire (du 1er au 31)'; }
  var r=getRecurring().filter(function(x){ return String(x.id)===String(c); })[0];
  return r?'Selon la paie : '+r.label:'Calendaire (du 1er au 31)';
}
// Cycle valable ? (une paie qui existe encore, ou des jours fixes)
function payById(id){ return getRecurring().filter(function(x){ return String(x.id)===String(id); })[0]||null; }
function cycleOk(c){
  if(!c) return false;
  if(isMix(c)){ var p=mixParts(c); return !!(payById(p.a)&&payById(p.b)); }
  return String(c).indexOf('r:')===0||!!payById(c);
}
// Mois du budget du foyer (Reglage « Mois du budget » en haut de l onglet Budget) : '' = du 1er au 31.
// Pas encore choisi : le mois le plus utilise par les comptes.
function householdCycle(){
  var s=(_cache.settings||{}).budgetCycle;
  if(s==='cal') return '';
  if(s&&cycleOk(s)) return String(s);
  var n={}, best='', bn=0;
  getAccounts().forEach(function(a){ if(!a.hidden&&cycleOk(a.cycle)){ var k=String(a.cycle); n[k]=(n[k]||0)+1; if(n[k]>bn){ bn=n[k]; best=k; } } });
  return best;

// Un compte sans mois propre suit le mois du budget ; comptes filtres avec des mois differents : mois du budget
function accCycle(a){ return a&&cycleOk(a.cycle)?String(a.cycle):householdCycle(); }
// Mois d un bouton du filtre : une personne suit sa propre paie, « Commun » suit les deux paies (28 -> 4)
function chipCycle(){
  var v=BG.prevAcc;
  if(v==='common'){ var mx=cycleChoices().filter(function(x){ return x.mix; })[0]; return mx?mx.val:householdCycle(); }
  if(/^u:/.test(v||'')){
    var uid=v.slice(2), hc=householdCycle(), pays=payList().filter(function(r){ var o=payOwner(r); return o&&String(o.id)===uid; });
    if(!pays.length) return null;
    if(pays.some(function(r){ return String(r.id)===String(hc); })) return hc;
    return String(pays[0].id);
  }
  return null;
}
function filterCycle(){
  var cc=chipCycle(); if(cc!=null) return cc;
  if(!BG.f||!BG.f.length) return householdCycle();
  var c=null;
  for(var i=0;i<BG.f.length;i++){ var ac=accCycle(findAccount(BG.f[i])); if(c===null) c=ac; else if(c!==ac) return householdCycle(); }
  return c||'';
}
// Choix du mois du budget : on touche la periode en haut de l onglet Budget
// Choix du mois du budget : standard, chaque paie, et le melange de deux paies mensuelles proches (ex. le 28 et le 5)
function cycleChoices(){
  var today=todayStr(), pays=payList(), out=[{val:'cal',title:'Mois standard',sub:'Du 1er au 31 · '+rangeLabel(calRange(new Date().getFullYear(),new Date().getMonth()))}];
  function who(r){ var o=payOwner(r); return o?' ('+o.name+')':''; }
  pays.forEach(function(r){ var pr=payRangeAt(r.id,today);
    out.push({val:String(r.id),title:'Selon la paie : '+r.label+who(r),sub:pr?'En ce moment : '+rangeLabel(pr):'Le '+(parseInt(r.day,10)||'?')+' de chaque mois'}); });

function monthStats(y,m){
  var rg=bgRange(y,m), tx=rangeTxns(rg), occ=rangeOccs(rg), groups=getGroups();
  var st={spent:0,upDep:0,incReal:0,incUp:0,epReal:0,byGroup:{},upByGroup:{},other:0,otherUp:0};
  for(var i=0;i<tx.length;i++){
    var t=tx[i], k=txnKind(t), a=amtMain(t);
    if(k==='dep'){
      var g=groupOfCat(t.cat), gk=g?g.key:'_autres';
      if(isPending(t)){ st.upDep+=a; st.upByGroup[gk]=(st.upByGroup[gk]||0)+a; }
      else { st.spent+=a; st.byGroup[gk]=(st.byGroup[gk]||0)+a; }
    } else if(k==='rev'){
      if(isPending(t)) st.incUp+=a; else st.incReal+=a;
    } else if(t.type==='transfert_in'&&!isPending(t)){
      var acc=findAccount(t.bank);
      if(acc&&(acc.type==='epargne'||acc.type==='invest')) st.epReal+=a;
    }
  }
  for(var o=0;o<occ.length;o++){
    var oc=occ[o]; if(oc.done) continue;
    var ocm=toMain(oc.amount,oc.bank);
    if(oc.kind==='dep'){ var og=groupOfCat(oc.cat), ok=og?og.key:'_autres'; st.upDep+=ocm; st.upByGroup[ok]=(st.upByGroup[ok]||0)+ocm; }
    if(oc.kind==='rev') st.incUp+=ocm;
  }
  st.incPlanned=sumMonthly(regulars('rev'));
  if(!st.incPlanned) st.incPlanned=st.incReal+st.incUp;
  st.planned=0;
  for(var g2=0;g2<groups.length;g2++) st.planned+=groupBudget(groups[g2]);
  st.planned=Math.round(st.planned*100)/100;
  st.saving=Math.max(0,st.incPlanned-st.planned);
  st.restant=st.incReal-st.spent-st.upDep; // revenus non confirmes : pas comptes
  st.range=rg;
  return st;
}

// ---------- Frequence des operations regulieres ----------
// freq : month / week / day / year ; every : tous les N ; anchor : premiere echeance ; end_date : derniere date possible
var WEEKDAYS_FR=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
function parseDs(ds){ var p=ds.split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function dsOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function recEvery(r){ return Math.max(1,parseInt(r.every,10)||1); }
// Jours du mois (y, m de 0 a 11) ou tombe une operation reguliere
function recDays(r,y,m){
  var dim=daysIn(y,m), f=r.freq||'month', an=r.anchor?parseDs(r.anchor):null, ev=recEvery(r), out=[];
  if(f==='month'){
    var md=an?(y-an.getFullYear())*12+(m-an.getMonth()):0;
    if(md>=0&&md%ev===0) out.push(Math.min(parseInt(r.day,10)||(an?an.getDate():1),dim));
  } else if(f==='year'){
    if(an&&an.getMonth()===m&&y>=an.getFullYear()&&(y-an.getFullYear())%ev===0) out.push(Math.min(an.getDate(),dim));
  } else if(f==='week'){
    var wd=an?an.getDay():1;
    for(var d=1;d<=dim;d++){
      var dt=new Date(y,m,d); if(dt.getDay()!==wd) continue;
      var wdiff=an?Math.round((dt-an)/86400000)/7:0;
      if(wdiff>=0&&wdiff%ev===0) out.push(d);
    }
  } else if(f==='day'){
    for(var k=1;k<=dim;k++){ var diff=an?Math.round((new Date(y,m,k)-an)/86400000):k-1; if(diff>=0&&diff%ev===0) out.push(k); }
  }
  if(an) out=out.filter(function(d){ return new Date(y,m,d)>=an; });
  if(r.end_date){ var en=parseDs(r.end_date); out=out.filter(function(d){ return new Date(y,m,d)<=en; }); }
  return out;
}
// Montant moyen par mois (pour les budgets)
function monthlyAmt(r){
  var a=parseFloat(r.amount)||0, f=r.freq||'month', ev=recEvery(r);
  if(f==='week') return a*52/12/ev;
  if(f==='day') return a*365/12/ev;
  if(f==='year') return a/12/ev;
  return a/ev;
}
function sumMonthly(list){ var s=0; for(var i=0;i<list.length;i++) s+=monthlyAmt(list[i])*rateOf(bankCur(list[i].bank)); return Math.round(s*100)/100; }
function freqLabel(r){
  var f=r.freq||'month', an=r.anchor?parseDs(r.anchor):null, ev=recEvery(r), t;
  if(f==='week') t=(ev>1?'Toutes les '+ev+' semaines, le ':'Chaque ')+WEEKDAYS_FR[an?an.getDay():1];
  else if(f==='day') t=ev>1?'Tous les '+ev+' jours':'Tous les jours';
  else if(f==='year') t=(ev>1?'Tous les '+ev+' ans':'Chaque année')+(an?' le '+an.getDate()+' '+MONTHS_FR[an.getMonth()]:'');
  else t=ev>1?'Tous les '+ev+' mois, le '+(parseInt(r.day,10)||1):'Tous les '+(parseInt(r.day,10)||1)+' du mois';
  if(r.end_date){ var en=parseDs(r.end_date); t+=' · jusqu’au '+en.getDate()+' '+MONTHS_ABBR[en.getMonth()].toLowerCase()+' '+en.getFullYear(); }
  return t;
}

// Premiere echeance a partir de la date de debut, selon les choix
function firstOccurrence(){
  var s=parseDs(E.date), f=E.freq, c;
  if(f==='month'){
    c=new Date(s.getFullYear(),s.getMonth(),Math.min(E.fDay,daysIn(s.getFullYear(),s.getMonth())));
    if(c<s){ var n=new Date(s.getFullYear(),s.getMonth()+1,1); c=new Date(n.getFullYear(),n.getMonth(),Math.min(E.fDay,daysIn(n.getFullYear(),n.getMonth()))); }
  } else if(f==='year'){
    c=new Date(s.getFullYear(),E.fMonth,Math.min(E.fDay,daysIn(s.getFullYear(),E.fMonth)));
    if(c<s) c=new Date(s.getFullYear()+1,E.fMonth,Math.min(E.fDay,daysIn(s.getFullYear()+1,E.fMonth)));
  } else if(f==='week'){
    c=new Date(s); while(c.getDay()!==E.fWday) c.setDate(c.getDate()+1);
  } else c=s;
  return c;
}

// Anneau : segments [{v,color,ic,hatch}] sur un total ; icones posees autour
function donutHtml(segs,total,center,rest){
  var R=80, C=2*Math.PI*R, off=0, svg='', icons='', info=[];
  // Fond de l anneau : en vue Reel, c est l argent qui reste (touchable aussi)
  if(rest&&total>0){
    info.push({l:rest.label,v:rest.v,p:rest.v/total*100,c:'#a8936a'});
    svg+='<circle class="dn-seg" data-k="0" onclick="dnPick(this,0)" cx="110" cy="110" r="'+R+'" fill="none" stroke="#e6dfd0" stroke-width="28"/>';
  } else svg+='<circle cx="110" cy="110" r="'+R+'" fill="none" stroke="#e6dfd0" stroke-width="28"/>';
  for(var i=0;i<segs.length;i++){
    var s=segs[i]; if(!(s.v>0)||!(total>0)) continue;
    var frac=Math.min(s.v/total,1-off/C); if(frac<=0) continue;
    var len=frac*C, k=info.length;
    info.push({l:s.label||'',v:s.v,p:s.v/total*100,c:s.hatch?'#d46a6a':s.color});
    svg+='<circle class="dn-seg" data-k="'+k+'" onclick="dnPick(this,'+k+')" cx="110" cy="110" r="'+R+'" fill="none" stroke="'+(s.hatch?'url(#bgHatch)':s.color)+'" stroke-width="28" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 110 110)"/>';
    if(s.ic&&frac>0.03){
      var mid=(off+len/2)/C*2*Math.PI-Math.PI/2, x=110+Math.cos(mid)*122, y=110+Math.sin(mid)*122;
      icons+='<span class="dn-ic" data-k="'+k+'" onclick="dnPick(this,'+k+')" style="left:'+(x/220*100)+'%;top:'+(y/220*100)+'%;background:'+s.color+'">'+svgIcon(s.ic)+'</span>';
    }
    off+=len;
  }
  var h='<div class="donut"><svg viewBox="0 0 220 220"><defs><pattern id="bgHatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3d6d2"/><rect width="4" height="8" fill="#e7aaa3"/></pattern></defs>'+svg+'</svg>'+icons+'<div class="dn-c" onclick="dnPick(this,-1)">'+center+'</div></div>';
  window._dnInfo=info; window._dnCenter=center;
  return h;
}
// Toucher ailleurs que sur l anneau : on revient a l affichage normal
document.addEventListener('click',function(e){
  if(e.target.closest&&e.target.closest('.donut [data-k],.donut .dn-c')) return;
  var ds=document.querySelectorAll('.donut[data-sel]');
  for(var i=0;i<ds.length;i++){ var c=ds[i].querySelector('.dn-c'); if(c) dnPick(c,-1); }
});
// Toucher une part de l anneau : elle s agrandit et le centre affiche sa categorie, son % et son montant
function dnPick(el,k){
  var d=el.closest('.donut'); if(!d) return;
  var cur=d.getAttribute('data-sel');
  if(k<0||String(k)===cur){ k=-1; d.removeAttribute('data-sel'); } else d.setAttribute('data-sel',k);
  var segs=d.querySelectorAll('[data-k]');
  for(var i=0;i<segs.length;i++){
    var on=k>=0&&segs[i].getAttribute('data-k')===String(k);
    segs[i].classList.toggle('on',on); segs[i].classList.toggle('dim',k>=0&&!on);
  }
  var c=d.querySelector('.dn-c'), it=(window._dnInfo||[])[k];
  if(k<0||!it){ c.innerHTML=window._dnCenter||''; return; }
  var pc=it.p<1&&it.p>0?'<1':String(Math.round(it.p));
  c.innerHTML='<span class="dn-lbl" style="color:'+it.c+'">'+esc(it.l)+'</span><b class="dn-big" style="color:'+it.c+'">'+pc+'<small>%</small></b><span class="dn-amt">'+fmtE(Math.round(it.v*100)/100)+'</span>';
}

function bgRegularSheet(kind,opt,existing){

function bgSaveRegular(kind,id){
  var amount=parseFloat(document.getElementById('rgAmount').value), label=document.getElementById('rgLabel').value.trim();
  var day=parseInt(document.getElementById('rgDay').value,10), catEl=document.getElementById('rgCat');

  if(!(day>=1&&day<=31)){ showToast('Jour entre 1 et 31'); return; }
  var r={label:label,amount:Math.round(amount*100)/100,day:day,cat:catEl?catEl.value:((getRecurring().filter(function(x){ return x.id===id; })[0]||{}).cat||'autre_rev'),bank:document.getElementById('rgBank').value,kind:kind,next_month:0};

function saveTxnEdit(){
  var txns=getTxns(), t=null;
  for(var i=0;i<txns.length;i++){ if(String(txns[i].id)===String(OC.txnId)){ t=txns[i]; break; } }
  if(!t) return;
  var amount=Math.round((parseFloat(String(OC.amount).replace(',','.'))||0)*100)/100;
  if(!(amount>0)){ showToast('Indique un montant'); return; }
  var upd={}; for(var k in t) upd[k]=t[k];
  upd.label=OC.label.trim()||t.label; upd.amount=amount; upd.cat=OC.cat; upd.bank=OC.bank||''; upd.date=OC.date||t.date; upd.note=OC.note.trim();
  if(OC.kind==='dep'){ var c=getCatObj(OC.cat); upd.type=c.group&&c.group!=='rev'?c.group:'dep_var'; }
  function save(msg){
    apiPost('/api/transactions',upd,function(err){
      if(err){ showToast('Erreur : '+err.message); return; }
      for(var j=0;j<txns.length;j++){ if(txns[j]===t) txns[j]=upd; }
      setTxns(txns); closeAccModal(); refreshViews(); showToast(msg||'Modifié');
    });
  }
  var f=OC.makeReg;
  if(!f||OC.reg||(OC.kind!=='dep'&&OC.kind!=='rev')) return save();
  var d=parseDs(upd.date), mk=mKey(d.getFullYear(),d.getMonth());
  var r={kind:OC.kind,label:upd.label,cat:upd.cat,bank:upd.bank||'',amount:upd.amount,day:d.getDate(),next_month:0,
    freq:f,every:1,anchor:upd.date,end_date:null,start_key:mk};
  apiPost('/api/recurring',r,function(err,res){
    if(err||!res||!res.id){ showToast('Erreur : '+((err&&err.message)||'opération régulière non créée')); return; }
    r.id=res.id; var arr=getRecurring().slice(); arr.push(r); setRecurring(arr);
    upd.rec_key=r.id+'@'+(f==='month'?mk:upd.date);     // cette operation = la premiere echeance, deja faite
    save(OC.kind==='rev'?'Revenu devenu régulier':'Dépense devenue régulière');
  });
}

// Ce qui se passe chaque jour du mois : transactions + echeances pas encore confirmees
function dayItems(y,m){
  var out={}, tx=monthTxns(y,m), occ=occurrences(y,m);
  function add(d,it){ (out[d]=out[d]||[]).push(it); }
  for(var i=0;i<tx.length;i++){
    var t=tx[i], k=txnKind(t);
    if(k==='tra'&&!t.rec_key) continue;          // virements ponctuels : pas dans le calendrier
    if(BG.onlyReg&&!t.rec_key) continue;         // interrupteur : seulement les operations regulieres
    add(parseInt(t.date.slice(8),10),{label:t.label,cat:t.cat,kind:k,amount:(k==='rev'||t.type==='transfert_in'?1:-1)*amtMain(t),txn:t,pending:isPending(t)});
  }
  for(var o=0;o<occ.length;o++){
    var oc=occ[o]; if(oc.done) continue;
    if(BG.f&&BG.f.indexOf(String(oc.bank))<0&&!(oc.kind==='tra'&&BG.f.indexOf(String(oc.r.to_bank))>=0)) continue;
    add(oc.day,{label:oc.label,cat:oc.cat,kind:oc.kind,amount:(oc.kind==='rev'?1:-1)*toMain(oc.amount,oc.bank),occ:oc,pending:true});
  }
  return out;
}
function visibleBalance(){ var s=0, a=getAccounts(); for(var i=0;i<a.length;i++){ if(!a[i].hidden&&(!BG.f||BG.f.indexOf(String(a[i].id))>=0)) s+=toMain(accountBalance(a[i]),a[i].id); } return Math.round(s*100)/100; }
// Operations jour par jour sur toute la periode du budget (ex. du 28 sept au 27 oct), par date "aaaa-mm-jj"
function rangeDayItems(r){
  var out={}, a=parseDs(r.start), b=parseDs(r.end);
  for(var d=new Date(a.getFullYear(),a.getMonth(),1);d<=b;d=new Date(d.getFullYear(),d.getMonth()+1,1)){
    var yy=d.getFullYear(), mm=d.getMonth(), it=dayItems(yy,mm);
    for(var k in it){ var ds=mPrefix(yy,mm)+'-'+pad(+k); if(ds>=r.start&&ds<=r.end) out[ds]=it[k]; }
  }
  return out;
}

function relDay(ds){

}

// ---------- Onglet Prevision ----------
// Solde jour par jour : 4 jours passes, aujourd hui, 14 jours a venir
function renderBgPrev(){
  var accs=getAccounts().filter(function(a){ return !a.hidden; }), html='<div class="bg-card">'+accChipsHtml(), sel=BG.prevAcc;
  var ids=selectedIds()||accs.map(function(a){ return String(a.id); });
  function inSel(b){ return ids.indexOf(String(b))>=0; }
  var cur=0; for(var a=0;a<accs.length;a++){ if(inSel(accs[a].id)) cur+=toMain(accountBalance(accs[a]),accs[a].id); }
  var today=todayStr(), t0=new Date(); t0.setHours(0,0,0,0);
  function dstr(n){ var d=new Date(t0); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  // mouvements par jour (passes : transactions ; a venir : transactions + echeances)
  var moves={}, upcoming=[], end=dstr(14), start=dstr(-4);
  var txns=getTxns();
  for(var t=0;t<txns.length;t++){
    var x=txns[t]; if(!inSel(x.bank)||Number(x.no_balance)) continue;
    var v=txnSign(x)*amtMain(x);
    if(isPending(x)&&x.type==='rev') continue; // revenu pas encore recu
    if(isPending(x)){ var dd=x.date>today?x.date:today; if(dd<=end){ moves[dd]=(moves[dd]||0)+v; upcoming.push({label:x.label,cat:x.cat,kind:txnKind(x),amount:v,txn:x,date:dd}); } }
    else if(x.date>start) moves[x.date]=(moves[x.date]||0)+v;
  }
  var mths=[[t0.getFullYear(),t0.getMonth()]], e=new Date(t0); e.setDate(e.getDate()+14);
  if(e.getMonth()!==t0.getMonth()) mths.push([e.getFullYear(),e.getMonth()]);
  for(var mm=0;mm<mths.length;mm++){
    var occ=occurrences(mths[mm][0],mths[mm][1]);
    for(var o=0;o<occ.length;o++){
      var oc=occ[o]; if(oc.done) continue;
      var od=oc.date<today?today:oc.date; if(od>end) continue;
      var ov=0;
      if(oc.kind==='tra'){ if(inSel(oc.bank)) ov-=toMain(oc.amount,oc.bank); if(inSel(oc.r.to_bank)) ov+=toMain(oc.amount,oc.r.to_bank); }
      else if(oc.kind==='rev') continue; // revenu regulier : compte seulement une fois confirme
      else if(inSel(oc.bank)||(!oc.bank&&sel==='all')) ov=-toMain(oc.amount,oc.bank);
      if(!ov) continue;
      moves[od]=(moves[od]||0)+ov;
      upcoming.push({label:oc.label,cat:oc.cat,kind:oc.kind,amount:ov,occ:oc,date:od});
    }
  }
  // Soldes de fin de journee, en partant du solde actuel
  var pastToday=0;
  for(var tx2=0;tx2<txns.length;tx2++){ var z=txns[tx2]; if(inSel(z.bank)&&!isPending(z)&&!Number(z.no_balance)&&z.date===today) pastToday+=txnSign(z)*amtMain(z); }
  var bars=[], b=cur-pastToday;   // solde a la fin d hier
  for(var j=1;j<=4;j++){ bars.unshift({d:dstr(-j),b:b,past:true}); b-=(moves[dstr(-j)]||0); }
  var run=cur+((moves[today]||0)-pastToday);
  bars.push({d:today,b:run,today:true});
  for(var f=1;f<=14;f++){ run+=(moves[dstr(f)]||0); bars.push({d:dstr(f),b:run}); }
  var mx=-Infinity, mn=Infinity; for(var bi=0;bi<bars.length;bi++){ mx=Math.max(mx,bars[bi].b); mn=Math.min(mn,bars[bi].b); }
  function barH(v){ return mx-mn<0.01?80:45+55*(v-mn)/(mx-mn); }
  var who=/^u:/.test(sel)?hhMembers().filter(function(m){ return 'u:'+m.id===sel; })[0]:null, fa=findAccount(sel);
  var label=sel==='all'?'Total courant':(sel==='common'?'Comptes communs':(who?'Comptes de '+esc(who.name):(fa?esc(fa.name):'Total courant')));
  html+='<div class="pv-tot"><div><span>'+label+'</span><b>'+fmtE(Math.round(cur))+'</b></div><div><span>Dans 14 jours</span><b class="muted">'+fmtE(Math.round(run))+'</b></div></div>';
  var bh='';
  for(var c=0;c<bars.length;c++){
    var br=bars[c], hgt=barH(br.b), dnum=parseInt(br.d.slice(8),10);
    bh+='<div class="pv-col'+(br.today?' today':'')+(br.past||br.today?' done':'')+(br.b<0?' neg':'')+'" title="'+dnum+' : '+fmtE(br.b)+'">'+
      (br.today?'<span class="pv-tag">Aujourd’hui</span>':'')+'<span class="pv-bar" style="height:'+hgt+'%"></span><span class="pv-d">'+(br.today||dnum%5===0?dnum:'')+'</span></div>';
  }
  html+='<div class="pv-chart">'+bh+'</div>';
  upcoming.sort(function(a,c2){ return a.date.localeCompare(c2.date); });
  if(!upcoming.length) html+='<div class="bg-empty">Rien de prévu d’ici là</div>';
  else {
    html+='<div class="gd-sec">À venir</div>'; var ld='';
    for(var u=0;u<upcoming.length;u++){
      var it=upcoming[u];
      if(it.date!==ld){ ld=it.date; html+='<div class="bc-dayhd">'+niceDate(it.date)+'</div>'; }
      html+=bcItemRow(it);
    }
  }
  return html+'</div>';
}


// ============================================================
// PAGE STATS : depenses ou revenus sur 7 jours, 1 mois, 1 an ou depuis le debut
// ============================================================
var ST={per:'7j',off:0,kind:'dep',split:'none',acc:'all',pick:null};
// Periode affichee : debut, fin, et periode precedente pour la comparaison
function stRange(per,off){
  var t=parseDs(todayStr()), s, e, lbl;
  if(per==='7j'){
    var mon=new Date(t); mon.setDate(t.getDate()-((t.getDay()+6)%7)+off*7);
    s=dsOf(mon); var su=new Date(mon); su.setDate(mon.getDate()+6); e=dsOf(su);
    var a=parseDs(s), b=parseDs(e);
    lbl=a.getMonth()===b.getMonth()?a.getDate()+' – '+b.getDate()+' '+MONTHS_ABBR[b.getMonth()].toLowerCase().replace('.',''):
      a.getDate()+' '+MONTHS_ABBR[a.getMonth()].toLowerCase().replace('.','')+' – '+b.getDate()+' '+MONTHS_ABBR[b.getMonth()].toLowerCase().replace('.','');
  } else if(per==='1m'){
    var d=new Date(t.getFullYear(),t.getMonth()+off,1);
    s=dsOf(d); e=mPrefix(d.getFullYear(),d.getMonth())+'-'+pad(daysIn(d.getFullYear(),d.getMonth()));
    lbl=MONTHS_FR[d.getMonth()].charAt(0).toUpperCase()+MONTHS_FR[d.getMonth()].slice(1)+' '+d.getFullYear();
  } else if(per==='1a'){
    var y=t.getFullYear()+off; s=y+'-01-01'; e=y+'-12-31'; lbl=String(y);
  } else {
    var first=todayStr(), tx=getTxns();
    for(var i=0;i<tx.length;i++){ if(tx[i].date&&tx[i].date<first) first=tx[i].date; }
    s=first.slice(0,8)+'01'; e=todayStr(); lbl='Depuis le début';
  }
  return {start:s,end:e,label:lbl};
}
// Operations retenues : depenses ou revenus reels (deja passes), sans les virements entre comptes
function stTxns(r){
  return getTxns().filter(function(t){
    if(!t.date||t.date<r.start||t.date>r.end||isPending(t)) return false;
    if(ST.acc!=='all'&&String(t.bank)!==String(ST.acc)) return false;
    var k=txnKind(t); return ST.kind==='rev'?k==='rev':k==='dep';
  });
}
// Barres : par jour (7 jours, 1 mois) ou par mois (1 an, depuis le debut)
function stBuckets(r,tx){
  var b=[], byMonth=ST.per==='1a'||ST.per==='tout';
  if(!byMonth){
    for(var d=parseDs(r.start);dsOf(d)<=r.end;d.setDate(d.getDate()+1)){
      var ds=dsOf(d); b.push({key:ds,lbl:d.getDate()+(ST.per==='7j'?' '+MONTHS_ABBR[d.getMonth()].toLowerCase():''),v:0});
    }
  } else {
    var a=parseDs(r.start), z=parseDs(r.end);
    for(var m=new Date(a.getFullYear(),a.getMonth(),1);m<=z;m=new Date(m.getFullYear(),m.getMonth()+1,1))
      b.push({key:mPrefix(m.getFullYear(),m.getMonth()),lbl:MONTHS_ABBR[m.getMonth()].replace('.','')+(ST.per==='tout'&&m.getMonth()===0?' '+String(m.getFullYear()).slice(2):''),v:0});
  }
  var idx={}; for(var i=0;i<b.length;i++) idx[b[i].key]=b[i];
  for(var j=0;j<tx.length;j++){ var k=byMonth?tx[j].date.slice(0,7):tx[j].date; if(idx[k]) idx[k].v+=amtMain(tx[j]); }
  return b;
}
function renderDashboard(){
  var page=document.getElementById('page-dashboard'); if(!page) return;
  var r=stRange(ST.per,ST.off), tx=stTxns(r), total=sumMain(tx), rev=ST.kind==='rev';
  var prevR=ST.per==='tout'?null:stRange(ST.per,ST.off-1), prev=prevR?sumMain(stTxns(prevR)):0, diff=Math.round((total-prev)*100)/100;
  var endEff=r.end<todayStr()?r.end:todayStr(), days=Math.max(1,Math.round((parseDs(endEff)-parseDs(r.start))/86400000)+1);
  var byMonth=ST.per==='1a'||ST.per==='tout', months=Math.max(1,Math.ceil(days/30.4));
  var avg=byMonth?total/months:total/days;
  var periods={'7j':'Cette semaine','1m':'Ce mois-ci','1a':'Cette année','tout':'Depuis le début'};
  var cmp={'7j':'vs semaine dernière','1m':'vs mois dernier','1a':'vs année dernière'};
  var pastLbl={'7j':'Cette semaine-là','1m':'Ce mois-là','1a':'Cette année-là'};
  var html='<div class="st-head'+(rev?' rev':'')+'">';
  if(ST.per!=='tout'){
    html+='<div class="bg-months"><button onclick="ST.off--;ST.pick=null;renderDashboard()">'+stRange(ST.per,ST.off-1).label+'</button><b>'+r.label+'</b>'+
      (ST.off<0?'<button onclick="ST.off++;ST.pick=null;renderDashboard()">'+stRange(ST.per,ST.off+1).label+'</button>':'<button disabled style="visibility:hidden">·</button>')+'</div>';
  } else html+='<div class="bg-months"><b>'+r.label+'</b></div>';
  var tabs=[['7j','7 jours'],['1m','1 mois'],['1a','1 an'],['tout','Tout']], th='';
  for(var i=0;i<tabs.length;i++) th+='<button class="'+(ST.per===tabs[i][0]?'on':'')+'" onclick="ST.per=\''+tabs[i][0]+'\';ST.off=0;ST.pick=null;renderDashboard()">'+tabs[i][1]+'</button>';
  html+='<div class="bg-tabs st-tabs">'+th+'</div></div><div class="bg-body">';
  // Carte principale
  html+='<div class="bg-card st-card"><div class="st-top"><div class="st-kind"><button class="'+(!rev?'on dep':'')+'" onclick="ST.kind=\'dep\';ST.pick=null;renderDashboard()">Dépense</button>'+
    '<button class="'+(rev?'on rev':'')+'" onclick="ST.kind=\'rev\';ST.pick=null;renderDashboard()">Revenu</button></div>'+
    '<button class="st-filter'+(ST.acc!=='all'?' on':'')+'" onclick="stFilter()" title="Choisir un compte"><svg class="ico" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M14 5v4M8 15v4"/></svg></button></div>'+
    (ST.acc!=='all'?'<div class="st-accf">'+esc(accountName(ST.acc))+' <button onclick="ST.acc=\'all\';renderDashboard()">✕</button></div>':'')+
    '<div class="st-sum"><div><b class="st-total '+(rev?'green':'red')+'">'+fmtE(total,true)+'</b><span>'+(ST.off===0?periods[ST.per]:(pastLbl[ST.per]||periods[ST.per]))+'</span></div>'+
    '<div class="st-avg"><b class="'+(rev?'green':'red')+'">'+fmtE(Math.round(avg*100)/100,true)+'</b><span>moyenne / '+(byMonth?'mois':'jour')+'</span></div></div>';
  if(prevR){
    var up=diff>0, good=rev?up:!up;
    html+='<div class="st-cmp"><span class="st-arrow '+(Math.abs(diff)<0.005?'eq':(good?'good':'bad'))+'">'+(Math.abs(diff)<0.005?'=':(up?'↑':'↓'))+'</span><span><b class="'+(Math.abs(diff)<0.005?'':(good?'green':'red'))+'">'+(diff>0?'+':'')+fmtE(diff,true)+'</b><i>'+cmp[ST.per]+'</i></span></div>';
  }
  // Barres
  var bk=stBuckets(r,tx), mx=0; for(var j=0;j<bk.length;j++) mx=Math.max(mx,bk[j].v);
  var showVal=bk.length<=12, bars='';
  for(var k=0;k<bk.length;k++){
    var b=bk[k], h=mx?Math.max(b.v?4:0,b.v/mx*100):0, showL=bk.length<=12||k%5===0||k===bk.length-1;
    bars+='<div class="st-col"><span class="st-val">'+(showVal&&b.v?fmtE(Math.round(b.v)):'')+'</span><span class="st-bar '+(rev?'rev':'')+'" style="height:'+h+'%"></span><span class="st-lbl">'+(showL?esc(b.lbl):'')+'</span></div>';
  }
  html+='<div class="st-chart'+(bk.length>12?' dense':'')+'">'+bars+'</div>';
  if(!tx.length) html+='<div class="bg-empty">Aucune '+(rev?'entrée d’argent':'dépense')+' sur cette période.</div>';
  html+='</div>';
  // Repartition
  var sp=[['none','<svg class="ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M5.6 18.4 18.4 5.6"/></svg>'],['group','Par groupe'],['cat','Par catégorie']], sh='';
  for(var q=0;q<sp.length;q++) sh+='<button class="'+(ST.split===sp[q][0]?'on':'')+(q===0?' st-none':'')+'" onclick="ST.split=\''+sp[q][0]+'\';ST.pick=null;renderDashboard()">'+sp[q][1]+'</button>';
  html+=goalsHtml();
  html+='<div class="st-split">'+sh+'</div>'+stBlocks(tx,total);
  page.innerHTML=html+'</div>';
}

  ['🏡','Apport pour un achat immobilier'],['🚗','Acheter une voiture'],['🎓','Financer des études'],['👶','Préparer l’arrivée d’un enfant'],

// Fond d une carte : 'def' image par defaut, 'img' photo choisie, 'none' couleur seule
function goalBg(g){ return g.bg||(g.img?'img':'none'); }
function goalImg(g){ var b=goalBg(g); if(b==='img'&&g.img) return g.img; if(b==='def') return goalDefImg(g.emoji); return ''; }
var GOAL_COLORS=['#ffffff','#ef4444','#f97316','#f2b705','#22a559','#14b8a6','#3b82f6','#8b5cf6','#ec4899','#000000'];
function getGoals(){ var s=_cache.settings||(_cache.settings={}); return s.goals||(s.goals=[]); }
function saveGoals(){ apiPost('/api/settings/goals',{value:getGoals()},null); }
function patrimoine(){ var a=getAccounts(), t=0; for(var i=0;i<a.length;i++) if(!a[i].hidden) t+=toMain(accountBalance(a[i]),a[i].id); return Math.round(t*100)/100; }
function goalSaved(g){
  if(g.acc==='all') return Math.max(0,patrimoine()-(parseFloat(g.base)||0));
  if(g.acc){ var a=findAccount(g.acc); if(a) return Math.max(0,toMain(accountBalance(a),a.id)); }
  return parseFloat(g.saved)||0;
}
function monthsUntil(ds){
  var t=new Date(), d=parseDs(ds);
  return (d.getFullYear()-t.getFullYear())*12+(d.getMonth()-t.getMonth())+(d.getDate()>=t.getDate()?0:-1)+1;
}
function goalDark(g){ var c=g.color||'#ffffff'; return !goalImg(g)&&hexLum(c)>.68; }
// La carte d un objectif (grande dans le parcours, plus petite dans la liste)
function goalCardHtml(g,small){
  var tg=parseFloat(g.target)||0, sv=goalSaved(g), pc=tg>0?Math.min(100,sv/tg*100):0, c=g.color||'#ffffff';
  var im=goalImg(g), al=im?(g.alpha==null?50:g.alpha)/100:1, dark=goalDark(g)&&al>.5;
  return '<div class="gc'+(small?' small':'')+(dark?' dark':'')+'">'+
    (im?'<div class="gc-img" style="background-image:url(&quot;'+im+'&quot;);filter:brightness('+((g.light==null?85:g.light)/100)+')"></div>':'')+
    '<div class="gc-tint" style="background:'+c+';opacity:'+al+'"></div>'+
    '<div class="gc-in"><div class="gc-name">'+(g.emoji&&small?g.emoji+' ':'')+esc(g.name||'Mon objectif')+'</div>'+
    '<div class="gc-tg">'+fmtE(tg)+'</div><div class="gc-pc">'+Math.floor(pc)+'%</div>'+
    '<div class="gc-bar"><span style="width:'+pc+'%"></span></div>'+
    '<div class="gc-st"><div><span>Épargné</span><b>'+fmtE(Math.round(sv))+'</b></div><div><span>Restant</span><b>'+fmtE(Math.max(0,Math.ceil(tg-sv)))+'</b></div></div>'+
    (small?goalSubHtml(g,sv,tg):'')+'</div></div>';
}
function goalSubHtml(g,sv,tg){
  if(tg>0&&sv>=tg) return '<div class="gc-sub">Objectif atteint !</div>';
  if(!g.date) return '';
  var n=monthsUntil(g.date), d=parseDs(g.date);
  return '<div class="gc-sub">'+(n>0?fmtE(Math.ceil((tg-sv)/n))+' / mois jusqu’à '+MONTHS_SHORT[d.getMonth()].toLowerCase()+' '+d.getFullYear():'Date dépassée')+'</div>';
}
function goalsHtml(){
  var gs=getGoals(), h='<div class="bg-sec"><b>Mes objectifs</b><button class="gl-add" onclick="openGoalWizard()">'+svgIcon('plus')+'Nouveau</button></div>';
  if(!gs.length) return h+'<button class="gl-empty" onclick="openGoalWizard()"><span class="gl-ic">🎯</span><span><b>Fixe-toi un objectif</b><small>Vacances, voiture, épargne de précaution… suis ce que tu mets de côté.</small></span></button>';

}
function goalNext(){ if(G.step<6){ G.step++; renderGoalWiz(); } else saveGoalWiz(); }

function gwLoadImg(file){
  var r=new FileReader();
  r.onload=function(){
    var im=new Image();
    im.onload=function(){
      var mx=640, s=Math.min(1,mx/Math.max(im.width,im.height)), cv=document.createElement('canvas');
      cv.width=Math.round(im.width*s); cv.height=Math.round(im.height*s);
      cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      G.img=cv.toDataURL('image/jpeg',.72); G.bg='img'; renderGoalWiz();
    };
    im.onerror=function(){ showToast('Image illisible'); };
    im.src=r.result;
  };
  r.readAsDataURL(file);
}

// Blocs de repartition (hauteur proportionnelle au montant) puis la liste des operations
function stBlocks(tx,total){
  var rev=ST.kind==='rev', parts=[];
  if(ST.split==='none') parts=[{key:'all',label:rev?'Revenus':'Dépenses',color:rev?'#3d8a5a':'#c9483e',v:total,tx:tx}];
  else {
    var map={};
    for(var i=0;i<tx.length;i++){
      var t=tx[i], key, label, color, ic=null;
      if(ST.split==='group'&&!rev){ var g=groupOfCat(t.cat); key=g?g.key:'_autres'; label=g?g.label:'Autres dépenses'; color=g?g.color:'#a99e90'; ic=g?g.ic:null; }
      else { var c=getCatObj(t.cat); key=t.cat||'_'; label=c.label; color=c.color&&c.color.charAt(0)==='#'&&c.color.length===7&&hexLum(c.color)<.7?c.color:(rev?'#3d8a5a':'#a99e90'); ic=c.ic&&ICONS[c.ic]?c.ic:null; }
      if(!map[key]) map[key]={key:key,label:label,color:color,ic:ic,v:0,tx:[]};
      map[key].v+=amtMain(t); map[key].tx.push(t);
    }
    for(var k in map) parts.push(map[k]);
    parts.sort(function(a,b){ return b.v-a.v; });
    // Par categorie : les categories d une meme couleur prennent des nuances differentes pour se distinguer
    if(ST.split!=='group'||rev){
      var seen={}, shades=[0,-.22,.2,-.38,.34,-.12,.1];
      for(var q=0;q<parts.length;q++){ var cl=parts[q].color, n=seen[cl]||0; seen[cl]=n+1; if(n) parts[q].color=shadeHex(cl,shades[n%shades.length]); }
    }
  }
  // Rien sur la periode : on affiche quand meme le total (0 €)
  if(!total) return '<div class="st-blocks"><div class="st-block empty"><b>'+fmtE(0,true)+'</b><span>'+(rev?'Aucun revenu':'Aucune dépense')+' sur cette période</span></div></div>';
  var html=(ST.split!=='none'?'<div class="st-tot"><span>Total</span><b class="'+(rev?'green':'red')+'">'+fmtE(total,true)+'</b></div>':'')+'<div class="st-blocks">';
  for(var p=0;p<parts.length;p++){
    var pt=parts[p], pct=Math.round(pt.v/total*100), h=Math.max(58,Math.round(pt.v/total*260));
    html+='<button class="st-block'+(ST.pick&&ST.pick!==pt.key?' dim':'')+'" style="background:'+pt.color+';height:'+h+'px" onclick="ST.pick=ST.pick===\''+pt.key+'\'?null:\''+pt.key+'\';renderDashboard()">'+
      (pt.ic?'<span class="st-bic">'+svgIcon(pt.ic)+'</span>':'')+'<b>'+fmtE(pt.v,true)+'</b><span>'+esc(pt.label)+' · '+pct+' %</span></button>';
  }
  html+='</div>';
  // Liste des operations du bloc choisi (ou de toute la periode)
  var list=tx;
  if(ST.pick){ for(var q=0;q<parts.length;q++){ if(parts[q].key===ST.pick) list=parts[q].tx; } }
  list=list.slice().sort(function(a,b){ return b.date.localeCompare(a.date)||(Number(b.id)-Number(a.id)); });
  html+='<div class="gd-sec">'+(ST.pick?esc((parts.filter(function(x){ return x.key===ST.pick; })[0]||{}).label||''):'Opérations')+' <small class="st-n">'+list.length+'</small></div><div class="bg-list">';
  for(var l=0;l<Math.min(list.length,40);l++){
    var t2=list[l];
    html+=bgRow(itemIcon(t2.label,t2.cat,txnKind(t2),'bg-ic'),t2.label,dayLabel(t2.date)+(t2.bank?' · '+accountName(t2.bank):''),
      '<b class="'+(rev?'green':'red')+'">'+(rev?'+':'-')+fmtEur(parseFloat(t2.amount)||0,bankCur(t2.bank))+'</b>','openTxnEdit(\''+Number(t2.id)+'\')');
  }
  if(list.length>40) html+='<div class="bg-empty">… et '+(list.length-40)+' autres</div>';
  return html+'</div>';
}

function qkFileList(list){

// Doublons : meme montant, meme sens, a 3 jours pres, meme compte si les deux en ont un.
// Note : 'sure' (meme jour + meme enseigne ou libelle proche), 'likely' (meme jour), 'maybe' (dates proches)
function qkDays(a,b){ return Math.round(Math.abs(new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/86400000); }
function qkSameName(a,b){
  var ma=findMerchant(a), mb=findMerchant(b);
  if(ma&&mb) return ma[0]===mb[0];
  var x=normTxt(a).replace(/[^a-z0-9]+/g,' ').trim(), y=normTxt(b).replace(/[^a-z0-9]+/g,' ').trim();
  if(!x||!y) return false;
  var wx=x.split(' ').filter(function(w){ return w.length>2; });
  return x.indexOf(y)>=0||y.indexOf(x)>=0||wx.some(function(w){ return (' '+y+' ').indexOf(' '+w+' ')>=0; });
}
function qkMatches(o){
  if(o.round) return [];                                      // arrondis : fusionnes avec la semaine deja importee
  var rank={sure:0,likely:1,maybe:2}, tra=o.kind==='tra';
  function real(n){ var b=n!=null?qkBankOf(n):null; return b&&b!=='new'?b:null; }
  var bank=tra?(real(o.from)||real(o.to)):qkBankOf(o.compte);
  if(!bank||bank==='new') return [];                           // compte cree a l import : rien a comparer
  var want=tra?(real(o.from)?'transfert':'transfert_in'):null;
  return getTxns().filter(function(t){
    var isTra=t.type==='transfert'||t.type==='transfert_in';
    if(tra?t.type!==want:isTra) return false;
    if(!tra&&(t.type==='rev')!==(o.kind==='rev')) return false;
    if(Math.abs((+t.amount||0)-o.amount)>=0.005) return false;
    if(bank&&t.bank&&String(t.bank)!==String(bank)) return false;
    return qkDays(t.date,o.date)<=3;
  }).map(function(t){
    var d=qkDays(t.date,o.date), nm=tra||qkSameName(t.label,o.label);
    return {t:t,level:d===0&&nm?'sure':d===0||nm?'likely':'maybe',days:d,sameName:nm};
  }).sort(function(a,b){ return rank[a.level]-rank[b.level]||a.days-b.days; });
}

function qkFr(d){ return d.split('-').reverse().join('/'); }
// Comptes du document (releve a plusieurs comptes : Pockets Revolut, livrets...) et compte du site choisi pour chacun

function qkGuessAcc(nom){

// Mouvements entre deux comptes du document : on rapproche la sortie de l un et l entree de l autre en un seul transfert.
// Une ligne sans son autre moitie reste un transfert, mais ne touche que son propre compte (le solde reste celui du releve).
function qkPair(ops){
  var out=[], used={}, link={};
  // 1er passage : l autre compte annonce correspond ; 2e passage : meme jour et meme montant suffisent
  [true,false].forEach(function(strict){
    ops.forEach(function(o,i){
      if(!o.interne||used[i]||link[i]!=null) return;
      ops.forEach(function(p,k){
        if(link[i]!=null||k===i||link[k]!=null||!p.interne||p.kind===o.kind||p.compte===o.compte) return;
        if(Math.abs(p.amount-o.amount)>=0.005||qkDays(p.date,o.date)>(strict?1:0)) return;
        if(strict&&(o.lie&&p.compte!==o.lie||p.lie&&o.compte!==p.lie)) return;
        link[i]=k; link[k]=i;
      });
    });
  });
  ops.forEach(function(o,i){
    if(!o.interne||used[i]) return;

    var src=o.kind==='dep'?o:(j>=0?ops[j]:null), dst=o.kind==='rev'?o:(j>=0?ops[j]:null);

// ---------- Petite monnaie (arrondis automatiques Revolut) ----------
// Les arrondis d une semaine (lundi -> dimanche) vers une meme Pocket = un seul transfert, date du lundi suivant
function qkMonday(ds){ var d=parseDs(ds), iso=(d.getDay()+6)%7+1; return addDays(ds,8-iso); }

function qkPartsOf(note){

// Fusion de deux listes d arrondis (meme jour + meme montant compte une fois de plus seulement s il apparait plus souvent)
function qkMergeParts(a,b){
  var n={}, out=[];
  function cnt(list){ var c={}; list.forEach(function(p){ var k=p.d+'|'+p.a.toFixed(2); c[k]=(c[k]||0)+1; }); return c; }
  var ca=cnt(a), cb=cnt(b);

  Object.keys(n).forEach(function(k){ var x=k.split('|'); for(var i=0;i<n[k];i++) out.push({d:x[0],a:parseFloat(x[1])}); });

function qkSum(parts){ return Math.round(parts.reduce(function(s,p){ return s+p.a; },0)*100)/100; }
function qkGroupRounds(list){
  var out=[], groups={};
  list.forEach(function(o){
    if(o.kind!=='tra'||!o.round){ out.push(o); return; }
    var mon=qkMonday(o.date), k=o.from+'|'+o.to+'|'+mon, g=groups[k];

function qkReview(r){
  var mine=getAccounts().filter(function(a){ return !a.hidden&&a.owner===currentUser; });
  var first=(mine[0]||myAccounts()[0]||{}).id||'';
  QK.doc=r.document; QK.remarque=r.remarque||''; QK.filter='all';
  QK.accs=(r.comptes||[]).slice(); QK.map={};
  var raw=r.operations||[], names={};

  raw.forEach(function(o){ o.compte=o.compte||''; if(!names[o.compte]){ names[o.compte]=1; QK.accs.push({nom:o.compte,banque:'',debut:null,fin:null}); } });

function qkDecide(add){

  var dups=qkDups(), pos=dups.indexOf(QK.rv), next=null;
  for(var k=1;k<=dups.length;k++){ var d=dups[(pos+k)%dups.length]; if(!QK.ops[d].seen){ next=d; break; } }

  qkReviewOpen(next);

function qkBankKey(name){

  for(var i=0;i<BANKS.length;i++){ var b=BANKS[i]; if(n.indexOf(normTxt(b.name).split(' (')[0])>=0||n.split(/\W+/).indexOf(b.key)>=0) return b.key; }

function qkSave(){
  var vis=qkVisible(), todo=vis.map(function(i){ return QK.ops[i]; }).filter(function(o){ return o.add; });
  if(!todo.length) return;
  var used={};
  todo.forEach(function(o){ (o.kind==='tra'?[o.from,o.to]:[o.compte]).forEach(function(n){ if(n!=null&&QK.map[n]==='new') used[n]=1; }); });
  var toCreate=QK.accs.filter(function(c){ return used[c.nom]; });
  document.getElementById('qkGo').disabled=true;
  function fail(err){ document.getElementById('qkGo').disabled=false; showToast('Erreur : '+err.message); }
  // 1. les comptes a creer (solde du debut du releve : les operations importees l amenent au solde de fin)
  var k=0, base=Date.now();
  (function next(){
    if(k>=toCreate.length) return qkSaveTxns(todo,toCreate.length);
    var c=toCreate[k], ep=/epargne|livret|coffre|precaution|ldds|lep|pel/.test(normTxt(c.nom));
    var acc={id:base+k,name:qkNewName(c),bank:qkBankKey(c.banque||c.nom),type:ep?'epargne':'quotidien',description:c.nom,color:'',
      solde:c.debut!=null?c.debut:0,soldeDate:todayStr(),soldeSetAt:Date.now(),sortOrder:getAccounts().length,owner:currentUser||'',currency:''};
    apiPost('/api/accounts',acc,function(err){

    });

}
// Arrondis d une semaine deja importee (meme lundi, memes comptes) : on complete ce transfert au lieu d en ajouter un
function qkMergeRound(o,label){
  var from=o.from!=null?qkBankOf(o.from):null, to=o.to!=null?qkBankOf(o.to):null, txns=getTxns();
  var ex=txns.filter(function(t){ return t.date===o.date&&/^🪙/.test(t.label||'')&&
    (from?(t.type==='transfert'&&String(t.bank)===String(from)):(t.type==='transfert_in'&&String(t.bank)===String(to))); })[0];
  if(!ex) return false;
  var parts=qkMergeParts(qkPartsOf(ex.note),o.parts), amt=qkSum(parts), note=qkPartsNote(parts);
  var pair=ex.transfer_pair?txns.filter(function(t){ return String(t.id)===String(ex.transfer_pair); })[0]:null;
  [ex,pair].forEach(function(t){ if(!t) return; t.amount=amt; t.note=note; apiPost('/api/transactions',t,null); });
  return true;
}
function qkSaveTxns(todo,nAcc){
  var now=Date.now()+1, out=[];
  todo.forEach(function(o){
    var label=String(o.label||'').trim()||'Opération';
    if(o.kind==='tra'&&o.round&&qkMergeRound(o,label)) return;
    if(o.kind==='tra'){
      var from=o.from!=null?qkBankOf(o.from):null, to=o.to!=null?qkBankOf(o.to):null;
      var a={id:now+out.length,date:o.date,label:label,cat:'autres_dep',amount:o.amount,type:'transfert',bank:from,need:'',note:o.detail||null};
      var b={id:now+out.length+1,date:o.date,label:label,cat:'autre_rev',amount:o.amount,type:'transfert_in',bank:to,need:'',note:o.detail||null};
      if(from&&to){ a.transfer_pair=b.id; a.transferPair=b.id; b.transfer_pair=a.id; b.transferPair=a.id; out.push(a,b); }
      else if(from) out.push(a); else if(to){ b.id=a.id; out.push(b); }
      return;
    }
    var g=getCatObj(o.cat).group;
    out.push({id:now+out.length,date:o.date,label:label,cat:o.cat,amount:o.amount,
      type:o.kind==='rev'?'rev':((g&&g!=='rev')?g:'dep_var'),bank:qkBankOf(o.compte)||'',
      need:o.kind==='rev'?'':((g==='dep'||g==='epargne')?'obligatoire':''),note:o.detail||null});
  });
  apiPost('/api/transactions/bulk',{transactions:out},function(err){
    if(err){ document.getElementById('qkGo').disabled=false; showToast('Erreur : '+err.message); return; }
    var txns=getTxns(); out.slice().reverse().forEach(function(t){ txns.unshift(t); }); setTxns(txns);
    // Comptes crees avec leur solde d aujourd hui : on retire l effet des operations importees pour garder ce solde
    Object.keys(QK.wizAccs||{}).forEach(function(id){
      var a=findAccount(id); if(!a) return;
      var d=0; out.forEach(function(t){ if(String(t.bank)===String(id)&&t.date<=todayStr()) d+=txnSign(t)*t.amount; });
      if(Math.abs(d)<0.005) return;
      a.solde=Math.round(((parseFloat(a.solde)||0)-d)*100)/100;
      apiPost('/api/accounts',a,null);
    });
    QK.wizAccs={};
    closeSheet(); refreshViews();
    showToast(todo.length+' opération'+(todo.length>1?'s':'')+' ajoutée'+(todo.length>1?'s':'')+(nAcc?' · '+nAcc+' compte'+(nAcc>1?'s':'')+' créé'+(nAcc>1?'s':''):''),2600);
  });
}

var AUTH={token:'',user:null,household:{members:[]}};
var currentName='';
var authMode='login', authMsg='', authErr='', resetToken='';
function memberName(id){ var m=(AUTH.household.members||[]).filter(function(x){ return String(x.id)===String(id); })[0]; return m?m.name:''; }

function renderAuth(mode){
  if(mode) authMode=mode;
  var box=document.getElementById('authBox'), h='<div class="login-logo"><span>'+svgIcon('piggy')+'</span></div><div class="login-title">Budget Mensuel</div>';
  function field(id,label,type,ph,ac){
    var inp='<input id="'+id+'" type="'+type+'" placeholder="'+(ph||'')+'" autocomplete="'+(ac||'off')+'"'+(type==='password'?' minlength="8"':'')+'>';
    return '<label class="au-f"><span>'+label+'</span>'+(type==='password'?pwWrap(inp):inp)+'</label>';
  }
  if(DEMO){
    h+='<div class="login-sub">Mode démo — les données restent sur cet appareil</div>'+field('auName','Ton prénom','text','Ex : Etienne','given-name')+
      '<button class="au-btn" onclick="authDemo()">Entrer</button>';
  } else if(authMode==='register'){
    h+='<div class="login-sub">Crée ton compte</div>'+
      field('auName','Prénom','text','Ex : Etienne','given-name')+
      field('auEmail','Adresse mail','email','toi@exemple.fr','email')+
      field('auLogin','Identifiant (facultatif)','text','Ex : etienne','username')+
      field('auPw','Mot de passe (8 caractères minimum)','password','','new-password')+
      field('auPw2','Confirme le mot de passe','password','','new-password')+
      '<button class="au-btn" onclick="authRegister()">Créer mon compte</button>'+
      '<button class="au-link" onclick="authErr=\'\';authMsg=\'\';renderAuth(\'login\')">J’ai déjà un compte</button>';
  } else if(authMode==='forgot'){
    h+='<div class="login-sub">Mot de passe oublié</div><p class="au-help">Indique le mail de ton compte : tu recevras un lien pour choisir un nouveau mot de passe.</p>'+
      field('auEmail','Adresse mail','email','toi@exemple.fr','email')+
      '<button class="au-btn" onclick="authForgot()">Envoyer le lien</button>'+
      '<button class="au-link" onclick="authErr=\'\';authMsg=\'\';renderAuth(\'login\')">Retour à la connexion</button>';
  } else if(authMode==='reset'){
    h+='<div class="login-sub">Choisis un nouveau mot de passe</div>'+
      field('auPw','Nouveau mot de passe (8 caractères minimum)','password','','new-password')+
      field('auPw2','Confirme le mot de passe','password','','new-password')+
      '<button class="au-btn" onclick="authReset()">Enregistrer</button>';
  } else {
    h+='<div class="login-sub">Connecte-toi pour accéder à ton budget</div>'+
      field('auIdent','Mail ou identifiant','text','','username')+
      field('auPw','Mot de passe','password','','current-password')+
      '<button class="au-btn" onclick="authLogin()">Se connecter</button>'+
      '<button class="au-link" onclick="authErr=\'\';authMsg=\'\';renderAuth(\'forgot\')">Mot de passe oublié ?</button>'+
      '<div class="au-sep"><span>Pas encore de compte ?</span></div>'+
      '<button class="au-btn ghost" onclick="authErr=\'\';authMsg=\'\';renderAuth(\'register\')">Créer un compte</button>';
  }
  if(authErr) h+='<div class="au-err">'+esc(authErr)+'</div>';
  if(authMsg) h+='<div class="au-ok">'+esc(authMsg)+'</div>';
  box.innerHTML=h;
  // Entree = valider
  var ins=box.querySelectorAll('input');
  for(var i=0;i<ins.length;i++) ins[i].onkeydown=function(e){ if(e.key==='Enter'){ var b=box.querySelector('.au-btn'); if(b) b.click(); } };
  if(ins[0]) setTimeout(function(){ ins[0].focus(); },100);
  document.getElementById('loginScreen').style.display='flex';
}
function auVal(id){ var el=document.getElementById(id); return el?el.value.trim():''; }
function authFail(msg){ authErr=msg; authMsg=''; renderAuth(); }
// Appel au serveur sans etre connecte
function authCall(path,body,cb){
  var xhr=new XMLHttpRequest(); xhr.open('POST',API_BASE+path,true);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onload=function(){ var d={}; try{ d=JSON.parse(xhr.responseText); }catch(e){} if(xhr.status===200) cb(null,d); else cb(new Error(d.error||'Erreur '+xhr.status)); };
  xhr.onerror=function(){ cb(new Error('Connexion au serveur impossible. Le site est-il lancé ?')); };
  xhr.send(JSON.stringify(body));
}
function authLogin(){
  var ident=auVal('auIdent'), pw=document.getElementById('auPw').value;
  if(!ident||!pw){ authFail('Remplis ton identifiant et ton mot de passe'); return; }
  authCall('/api/auth/login',{ident:ident,password:pw},function(err,d){ if(err) authFail(err.message); else authDone(d); });
}
function authRegister(){
  var pw=document.getElementById('auPw').value, pw2=document.getElementById('auPw2').value;
  if(pw!==pw2){ authFail('Les deux mots de passe ne sont pas identiques'); return; }
  authCall('/api/auth/register',{name:auVal('auName'),email:auVal('auEmail'),login:auVal('auLogin'),password:pw},function(err,d){ if(err) authFail(err.message); else authDone(d); });
}
function authForgot(){
  var email=auVal('auEmail'); if(!email){ authFail('Indique ton adresse mail'); return; }
  authCall('/api/auth/forgot',{email:email},function(err,d){
    if(err){ authFail(err.message); return; }
    authErr=''; authMsg=d.mail?'Si un compte existe avec ce mail, un lien vient d’être envoyé. Pense à regarder dans les indésirables.':
      'L’envoi de mails n’est pas encore configuré sur le serveur : le lien s’affiche dans la fenêtre du serveur.';
    renderAuth('login');
  });
}
function authReset(){
  var pw=document.getElementById('auPw').value, pw2=document.getElementById('auPw2').value;
  if(pw!==pw2){ authFail('Les deux mots de passe ne sont pas identiques'); return; }
  authCall('/api/auth/reset',{token:resetToken,password:pw},function(err,d){
    if(err){ authFail(err.message); return; }
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
    authDone(d); showToast('Mot de passe modifié');
  });
}
// Connexion reussie : on garde le jeton sur l appareil et on ouvre le site
// Mot de passe : un oeil pour afficher ou cacher ce qu on tape
function pwWrap(inp){ return '<span class="pw-wrap">'+inp+'<button type="button" class="pw-eye" onclick="pwToggle(this)" title="Afficher le mot de passe">'+svgIcon('eye')+'</button></span>'; }
function pwToggle(b){
  var i=b.parentNode.querySelector('input'), show=i.type==='password';
  i.type=show?'text':'password'; b.innerHTML=svgIcon(show?'eyeOff':'eye'); b.title=show?'Cacher le mot de passe':'Afficher le mot de passe';
}
function authDone(d){
  if(d.token){ AUTH.token=d.token; try{ localStorage.setItem('budget_token',d.token); }catch(e){} }
  AUTH.user=d.user; AUTH.household=d.household||{members:[]};
  currentUser=String(d.user.id); currentName=d.user.name; avatarDemoLoad();
  authErr=''; authMsg='';
  document.getElementById('loginScreen').style.display='none';
  document.body.classList.add('on-home');
  switchPage('home'); initApp();
}
function authDemo(){
  var n=auVal('auName')||'Moi';
  try{ localStorage.setItem('budget_user',n); }catch(e){}
  authDone({user:{id:'demo',name:n},household:{members:[{id:'demo',name:n}]}});
}
// Session expiree ou refusee par le serveur
function authExpired(){
  if(!AUTH.token) return;
  AUTH.token=''; try{ localStorage.removeItem('budget_token'); }catch(e){}
  authErr='Ta session a expiré, reconnecte-toi.'; renderAuth('login');
}
function logout(){
  if(!DEMO&&AUTH.token){ var x=new XMLHttpRequest(); x.open('POST',API_BASE+'/api/auth/logout',true); x.setRequestHeader('Authorization','Bearer '+AUTH.token); x.send(); }
  AUTH={token:'',user:null,household:{members:[]}}; currentUser=''; currentName='';
  try{ localStorage.removeItem('budget_token'); localStorage.removeItem('budget_user'); }catch(e){}
  _cache={txns:null,budget:null,cats:null,recurring:null,applied:null,epargne:null,accounts:null};
  document.body.classList.remove('on-home');
  authErr=''; authMsg=''; renderAuth('login');
}
// Au chargement : lien "nouveau mot de passe", session gardee sur l appareil, ou ecran de connexion
function authStart(){
  var m=/[?&]reset=([^&]+)/.exec(location.search);
  if(m&&!DEMO){ resetToken=decodeURIComponent(m[1]); renderAuth('reset'); return; }
  if(DEMO){ var n=null; try{ n=localStorage.getItem('budget_user'); }catch(e){} if(n){ authDone({user:{id:'demo',name:n},household:{members:[{id:'demo',name:n}]}}); return; } renderAuth('login'); return; }
  var t=null; try{ t=localStorage.getItem('budget_token'); }catch(e){}
  if(!t){ renderAuth('login'); return; }
  AUTH.token=t;
  var xhr=new XMLHttpRequest(); xhr.open('GET',API_BASE+'/api/auth/me',true); xhr.setRequestHeader('Authorization','Bearer '+t);
  xhr.onload=function(){ if(xhr.status===200){ var d=JSON.parse(xhr.responseText); authDone(d); } else { AUTH.token=''; try{ localStorage.removeItem('budget_token'); }catch(e){} renderAuth('login'); } };
  xhr.onerror=function(){ authErr='Connexion au serveur impossible. Le site est-il lancé ?'; renderAuth('login'); };
  xhr.send();
}
// Mise a jour des membres du foyer (apres une invitation acceptee, etc.)
function refreshMe(cb){
  if(DEMO){ if(cb) cb(); return; }
  apiGet('/api/auth/me',function(err,d){ if(!err&&d){ AUTH.user=d.user; AUTH.household=d.household; currentName=d.user.name; } if(cb) cb(); });
}

function setAdmin(){
  openSheet(sheetHead('Administration')+'<p class="sheet-note">Chargement…</p>');

    if(err){ openSheet(sheetHead('Administration')+'<p class="sheet-note">'+esc(err.message||'Erreur')+'</p>'); return; }
    function day(t){ if(!t) return 'jamais'; var x=new Date(String(t).replace(' ','T')+(String(t).indexOf('Z')<0&&String(t).indexOf('T')<0?'Z':'')); return isNaN(x)?'—':x.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'}); }
    var byH={}, order=[];
    for(var i=0;i<d.users.length;i++){ var u=d.users[i], h=u.household_id; if(!byH[h]){ byH[h]=[]; order.push(h); } byH[h].push(u); }
    var html='';

      var hh=(d.households||[]).filter(function(x){ return x.id===order[k]; })[0], c=hh&&hh.counts;

        '<button onclick="setAdminHh('+order[k]+')">Données ›</button></div><div class="adm-list">';
      for(var j=0;j<list.length;j++){
        var v=list[j];
        html+='<div class="adm-u"><span class="adm-av">'+esc((v.name||'?').charAt(0).toUpperCase())+'</span><div><b>'+esc(v.name)+(v.admin?' <i>admin</i>':'')+(String(v.id)===currentUser?' <i class="me">toi</i>':'')+'</b>'+
          '<span>'+esc(v.email)+(v.login?' · '+esc(v.login):'')+'</span><small>Inscrit le '+day(v.created_at)+' · vu le '+day(v.last_seen)+'</small></div></div>';
      }

// Administration d un foyer : sauvegardes du serveur, remise a une date, effacement des donnees
function admDate(t){ var x=new Date(t); return isNaN(x)?'—':x.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+' à '+x.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function admCounts(c){ return c.accounts+' compte'+(c.accounts>1?'s':'')+' · '+c.transactions+' opération'+(c.transactions>1?'s':'')+' · '+c.recurring+' régulière'+(c.recurring>1?'s':''); }
function setAdminHh(hid){
  openSheet(sheetHead('Foyer n°'+hid)+'<p class="sheet-note">Chargement…</p>');
  apiGet('/api/admin/households/'+hid,function(err,d){
    if(err||!d||d.error){ openSheet(sheetHead('Foyer n°'+hid)+'<p class="sheet-note">'+esc((d&&d.error)||'Erreur')+'</p>'); return; }
    var mine=AUTH.household&&String(AUTH.household.id)===String(hid);
    var h=sheetHead('Foyer n°'+hid)+
      '<p class="sheet-note">'+esc(d.members.map(function(m){ return m.name; }).join(', ')||'Aucun membre')+(mine?' · <b>c’est ton foyer</b>':'')+'</p>'+
      '<div class="detail-list"><div><span>Comptes bancaires</span><span>'+d.counts.accounts+'</span></div><div><span>Opérations</span><span>'+d.counts.transactions+'</span></div>'+
      '<div><span>Opérations régulières</span><span>'+d.counts.recurring+'</span></div><div><span>Objectifs</span><span>'+d.counts.goals+'</span></div></div>'+
      '<div class="adm-h"><span>Sauvegardes du serveur</span><button onclick="admBackup('+hid+')">+ Sauvegarder</button></div>'+
      '<p class="sheet-note">Une copie est faite chaque nuit, et automatiquement avant chaque effacement ou remise. Les 40 dernières sont gardées.</p>';
    if(!d.backups.length) h+='<p class="sheet-note"><i>Aucune sauvegarde pour l’instant.</i></p>';
    else{
      h+='<div class="adm-bk">';
      d.backups.forEach(function(b){
        h+='<div class="adm-b"><div><b>'+esc(admDate(b.at))+'</b><span>'+esc(b.label)+'</span><small>'+esc(admCounts(b.counts||{accounts:0,transactions:0,recurring:0}))+'</small></div>'+
          '<button class="adm-get" title="Télécharger" onclick="admDownload('+hid+',\''+esc(b.file)+'\')">⤓</button>'+
          '<button class="adm-put" onclick="admRestore('+hid+',\''+esc(b.file)+'\',\''+esc(admDate(b.at))+'\')">Remettre</button></div>';
      });
      h+='</div>';
    }
    h+='<div class="adm-danger"><b>Effacer les données du foyer</b><p>Comptes bancaires, opérations, régulières, budget, catégories et objectifs. Les membres gardent leur compte et repartent de zéro. Une sauvegarde est faite juste avant : tu pourras tout remettre.</p>'+
      '<button class="sheet-btn ghost" onclick="admWipe('+hid+','+d.counts.transactions+')">Effacer les données…</button></div>';

  });

function admBackup(hid){
  apiPost('/api/admin/households/'+hid+'/backup',{},function(err,r){
    if(err||!r||!r.ok){ showToast((r&&r.error)||'Sauvegarde impossible'); return; }
    showToast('Sauvegarde faite'); setAdminHh(hid);
  });
}
// Apres un changement sur son propre foyer, on recharge la page pour revoir les bonnes donnees
function admAfter(hid,msg){
  if(AUTH.household&&String(AUTH.household.id)===String(hid)){ showToast(msg); setTimeout(function(){ location.reload(); },900); return; }
  showToast(msg); setAdminHh(hid);
}
function admRestore(hid,file,when){
  openSheet(sheetHead('Remettre une sauvegarde')+
    '<p class="sheet-note">Le foyer n°'+hid+' va retrouver ses données du <b>'+esc(when)+'</b>. Tout ce qui a été saisi depuis sera remplacé.</p>'+

function admRestoreGo(hid,file){

function admWipe(hid,n){

function admWipeGo(hid){

function admDownload(hid,file){
  var xhr=new XMLHttpRequest(); xhr.open('GET',API_BASE+'/api/admin/households/'+hid+'/backups/'+encodeURIComponent(file),true);
  xhr.setRequestHeader('Authorization','Bearer '+AUTH.token); xhr.responseType='blob';
  xhr.onload=function(){
    if(xhr.status!==200){ showToast('Téléchargement impossible'); return; }
    var a=document.createElement('a'); a.href=URL.createObjectURL(xhr.response); a.download='foyer-'+hid+'_'+file;
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
  };
  xhr.send();
}

function paySuggestions(){
  var out=[], pays=payList(), hc=householdCycle(), today=todayStr();
  if(!pays.length) return out;
  // 1. le mois du budget ne suit aucune paie
  var mine=null;
  if(false){
    mine=pays.filter(function(r){ var o=payOwner(r); return o&&String(o.id)===String(currentUser); })[0]||pays.slice().sort(function(a,b){ return b.amount-a.amount; })[0];
    out.push({t:'Le mois du budget est '+(hc?'à jours fixes ('+cycleLabel(hc).toLowerCase()+')':'du 1er au 31')+'. Le faire démarrer le jour où « '+mine.label+' » est confirmée : le mois attend la paie si elle a du retard.',
      b:'Suivre « '+mine.label+' »', go:function(){ payUseCycle(mine.id); }});
  }
  pays.forEach(function(r){
    if(accLocked(r.bank)) return; // paie d un autre membre : la regle du foyer ne permet pas d y toucher
    var h=payHistory(r), day=parseInt(r.day,10)||1;
    // 2. paie qui arrive souvent un autre jour que prevu
    if(h.length>=2&&(r.freq||'month')==='month'){
      var days=h.slice(0,4).map(function(x){ return parseDs(x.date).getDate(); }), md=median(days);
      if(md!==day&&Math.abs(md-day)<=7&&days.filter(function(d){ return d===md; }).length>=Math.min(2,days.length)) out.push({
        t:'« '+r.label+' » est arrivée le '+days.join(', le ')+' ces derniers mois, alors qu’elle est prévue le '+day+'. Prévoir le '+md+' rendra le calendrier plus juste.',
        b:'Prévoir le '+md, go:function(){ payUpdate(r,{day:md}); }});
    }
    // 3. montant recu different du montant prevu
    if(h.length>=2&&Math.abs(h[0].amount-h[1].amount)<0.01&&Math.abs(h[0].amount-(+r.amount))>=1) out.push({
      t:'« '+r.label+' » : tu as reçu '+fmtE(h[0].amount,true)+' les deux dernières fois, '+fmtE(+r.amount,true)+' est prévu.',
      b:'Prévoir '+fmtE(h[0].amount,true), go:function(){ payUpdate(r,{amount:h[0].amount}); }});
    // 4. paie passee, pas encore confirmee
    var w=payWaiting(r.id);
    if(!h.length){ // jamais confirmee : la derniere echeance passee (40 jours max)
      var d0=parseDs(today), cand=[];
      for(var dm=-1;dm<=0;dm++){ var x=new Date(d0.getFullYear(),d0.getMonth()+dm,1); cand=cand.concat(occurrences(x.getFullYear(),x.getMonth()).filter(function(oc){ return String(oc.r.id)===String(r.id)&&!oc.done&&oc.date<=today&&qkDays(oc.date,today)<=40; })); }
      w=cand.sort(function(a,b){ return a.date<b.date?1:-1; })[0]||null;
    }
    if(w&&qkDays(w.date,today)>=1) out.push({t:'« '+r.label+' » était prévue le '+shortDay(w.date)+' et n’est pas encore confirmée.',b:'Confirmer',go:function(){ closeSheet(); bgOpenOcc(w.key); }});
    // 5. paie sans compte
    if(!r.bank) out.push({t:'« '+r.label+' » n’a pas de compte : elle ne compte pas dans les soldes.',b:'Choisir',go:function(){ closeSheet(); openRegularList('rev'); }});
    // 6. comptes d une autre personne qui a sa propre paie
    var o=payOwner(r);
    var inHc=String(r.id)===String(hc)||(isMix(hc)&&(mixParts(hc).a===String(r.id)||mixParts(hc).b===String(r.id)));
    if(o&&!inHc&&!(mine&&String(mine.id)===String(r.id))){
      var accs=getAccounts().filter(function(a){ return String(a.owner)===String(o.id)&&!a.hidden&&String(a.cycle)!==String(r.id)&&!accLocked(a.id); });
      if(accs.length) out.push({t:'Les comptes de '+o.name+' ('+accs.map(function(a){ return a.name; }).join(', ')+') suivent le mois du foyer. Les faire démarrer avec sa paie « '+r.label+' » ?',
        b:'Régler '+(accs.length>1?'ses comptes':'son compte'), go:function(){ payAccountsCycle(accs,r.id); }});
    }
  });
  return out;
}

function sendBroadcast(){

function toggleNotif(){
  if(NP.on){
    pushSubscription().then(function(sub){
      if(!sub){ NP.on=false; renderNotif(); return; }
      apiPost('/api/push/unsubscribe',{endpoint:sub.endpoint},null);
      sub.unsubscribe().then(function(){ NP.on=false; renderNotif(); showToast('Notifications désactivées'); });
    });
    return;
  }
  Notification.requestPermission().then(function(p){
    if(p!=='granted'){ showToast('Notifications refusées'); renderNotif(); return; }
    apiGet('/api/push/key',function(err,d){
      if(err||!d||!d.key){ showToast('Le serveur ne répond pas'); return; }
      swReady().then(function(reg){ return reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(d.key)}); }).then(function(sub){
        apiPost('/api/push/subscribe',{subscription:sub.toJSON()},function(e2){

  r.forEach(function(x){

      body:x.acc.name+' : '+fmtE(Math.round(x.min))+' prévu '+(x.date===todayStr()?'aujourd’hui':'le '+shortDay(x.date))+'. Pense à faire un virement.'},null);
  });
}
function checkBudgetPush(){
  setTimeout(checkLowPush,300);
  if(DEMO||!AUTH.token) return;
  var al=[]; try{ al=budgetAlerts(); }catch(e){ return; }
  var d=new Date(), mk=d.getFullYear()+'-'+pad(d.getMonth()+1);

var AV_EMOJIS=['😀','😄','😎','🥰','😇','🤓','🥳','😴','🤠','🧐','🙂','😉','👩','👨','👱‍♀️','👱‍♂️','👩‍🦰','👨‍🦰','👩‍🦱','👨‍🦱','👩‍🦳','👨‍🦳','👧','👦','👵','👴','🧑‍💻','👩‍🍳','🐶','🐱','🦊','🐻','🐼','🐨','🐯','🦁','🐸','🐵','🦄','🐰','🌸','🌻','⭐️','🔥','💎','🍀','☀️','🌈'];
function initialsOf(n){ var p=String(n||'?').trim().split(/\s+/); return ((p[0]||'?').charAt(0)+(p[1]?p[1].charAt(0):'')).toUpperCase(); }
function avatarInner(u){
  var a=u&&u.avatar, bg=a&&a.bg||AV_BGS[0];
  if(a&&a.type==='photo'&&a.img) return {bg:'url('+a.img+') center/cover',html:''};
  if(a&&a.type==='memoji') return {bg:bg,html:memojiSvg(a.mj)};
  if(a&&a.type==='emoji'&&a.emoji) return {bg:bg,html:'<span class="av-emo">'+a.emoji+'</span>'};
  return {bg:bg,html:esc(a&&a.text?a.text:initialsOf(u&&u.name))};
}
function paintAvatar(el,u){ if(!el) return; var v=avatarInner(u); el.style.background=v.bg; el.innerHTML=v.html; el.classList.toggle('has-img',!!(u&&u.avatar&&u.avatar.type==='photo')); }
function avatarDemoLoad(){ if(!DEMO||!AUTH.user) return; try{ var a=JSON.parse(localStorage.getItem('budget_demo_avatar')||'null'); if(a) AUTH.user.avatar=a; }catch(e){} }
var AVE=null;
function openAvatarEditor(){
  var a=(AUTH.user&&AUTH.user.avatar)||{};
  AVE={type:a.type||'memoji',bg:a.bg||AV_BGS[5],text:a.text||initialsOf(currentName),emoji:a.emoji||'😀',img:a.img||'',mj:Object.assign(mjDefault(),a.mj||{}),tab:'hair'};
  renderAvatarEditor();
}
function renderAvatarEditor(){
  var tabs=[['memoji','Personnage'],['initials','Initiales'],['emoji','Emoji'],['photo','Photo']], th='', body='';
  for(var i=0;i<tabs.length;i++) th+='<button class="'+(AVE.type===tabs[i][0]?'on':'')+'" onclick="AVE.type=\''+tabs[i][0]+'\';renderAvatarEditor()">'+tabs[i][1]+'</button>';
  if(AVE.type==='memoji') body=mjEditorHtml();
  else if(AVE.type==='initials') body='<div class="sf"><label>Tes initiales (2 lettres max)</label><input id="aveText" maxlength="2" value="'+esc(AVE.text)+'" oninput="AVE.text=this.value.toUpperCase();aveRefresh()"></div>';
  else if(AVE.type==='emoji'){ var e=''; for(var k=0;k<AV_EMOJIS.length;k++) e+='<button class="ave-emo'+(AVE.emoji===AV_EMOJIS[k]?' on':'')+'" onclick="AVE.emoji=\''+AV_EMOJIS[k]+'\';renderAvatarEditor()">'+AV_EMOJIS[k]+'</button>'; body='<div class="ave-emos">'+e+'</div>'; }
  else body='<label class="sheet-btn ghost ave-pick">'+(AVE.img?'Changer de photo':'Choisir une photo')+'<input type="file" accept="image/*" onchange="if(this.files[0])aveLoad(this.files[0])"></label>';
  var cols='';
  if(AVE.type!=='photo'&&AVE.type!=='memoji') for(var c=0;c<AV_BGS.length;c++) cols+='<button class="ave-col'+(AVE.bg===AV_BGS[c]?' on':'')+'" style="background:'+AV_BGS[c]+'" onclick="AVE.bg=AV_BGS['+c+'];renderAvatarEditor()"></button>';
  var sb=document.getElementById('sheetBody'), sy=sb&&document.getElementById('aveBig')?sb.parentNode.scrollTop:0, tx=document.querySelector('.mj-tabs')?document.querySelector('.mj-tabs').scrollLeft:0;
  openSheet(sheetHead('Mon avatar')+'<div class="ave-prev"><span class="ave-big" id="aveBig"></span></div>'+
    '<div class="seg ave-tabs">'+th+'</div>'+body+(cols?'<div class="ave-cols">'+cols+'</div>':'')+
    '<button class="sheet-btn" onclick="saveAvatar()">Enregistrer</button>');
  aveRefresh();
  if(sy) document.getElementById('sheetBody').parentNode.scrollTop=sy;
  var mt=document.querySelector('.mj-tabs'); if(mt) mt.scrollLeft=tx;
}
function aveRefresh(){ paintAvatar(document.getElementById('aveBig'),{name:currentName,avatar:{type:AVE.type,bg:AVE.bg,text:AVE.text,emoji:AVE.emoji,img:AVE.img,mj:AVE.mj}}); }
// Editeur du personnage : une rangee de categories, puis les choix en vignettes (comme sur iPhone)
function mjEditorHtml(){
  var t=AVE.tab, tabs='', grid='';
  for(var i=0;i<MJ_TABS.length;i++) tabs+='<button class="'+(t===MJ_TABS[i][0]?'on':'')+'" onclick="AVE.tab=\''+MJ_TABS[i][0]+'\';renderAvatarEditor()">'+MJ_TABS[i][1]+'</button>';
  var colors={skin:MJ_SKIN,hairc:MJ_HAIRC,eyec:MJ_EYEC,shirt:MJ_SHIRT,bg:AV_BGS}[t];
  if(colors){
    for(var c=0;c<colors.length;c++){ var on=t==='bg'?AVE.bg===colors[c]:AVE.mj[t]===colors[c];
      grid+='<button class="mj-col'+(on?' on':'')+'" style="background:'+colors[c]+'" onclick="mjSet(\''+t+'\','+c+')"></button>'; }
    grid='<div class="mj-cols">'+grid+'</div>';
  } else {
    var opts=MJ_OPTS[t]||[];
    for(var o=0;o<opts.length;o++){ var cfg=Object.assign({},AVE.mj); cfg[t]=opts[o][0];
      grid+='<button class="mj-opt'+(AVE.mj[t]===opts[o][0]?' on':'')+'" onclick="AVE.mj.'+t+'=\''+opts[o][0]+'\';renderAvatarEditor()"><span class="mj-th" style="background:'+AVE.bg+'">'+memojiSvg(cfg)+'</span><small>'+opts[o][1]+'</small></button>'; }
    grid='<div class="mj-opts">'+grid+'</div>';
  }
  return '<div class="mj-tabs">'+tabs+'</div>'+grid+'<button class="mj-rand" onclick="mjRandom()">'+svgIcon('repeat')+' Au hasard</button>';
}
function mjSet(t,i){ if(t==='bg') AVE.bg=AV_BGS[i]; else AVE.mj[t]={skin:MJ_SKIN,hairc:MJ_HAIRC,eyec:MJ_EYEC,shirt:MJ_SHIRT}[t][i]; renderAvatarEditor(); }
function mjRandom(){
  function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
  var m={skin:pick(MJ_SKIN),hairc:pick(MJ_HAIRC.slice(0,8)),eyec:pick(MJ_EYEC),shirt:pick(MJ_SHIRT)};
  for(var k in MJ_OPTS) m[k]=pick(MJ_OPTS[k])[0];
  if(Math.random()<.6) m.beard='aucune'; if(Math.random()<.6) m.glasses='aucune'; if(Math.random()<.75) m.hat='aucun';
  AVE.mj=m; AVE.bg=pick(AV_BGS); renderAvatarEditor();
}
// Photo : recadree en carre et reduite
function aveLoad(file){
  var r=new FileReader();
  r.onload=function(){ var im=new Image(); im.onload=function(){
    var s=Math.min(im.width,im.height), cv=document.createElement('canvas'); cv.width=cv.height=256;
    cv.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);
    AVE.img=cv.toDataURL('image/jpeg',.8); AVE.type='photo'; renderAvatarEditor();
  }; im.src=r.result; };
  r.readAsDataURL(file);
}
function saveAvatar(){
  if(AVE.type==='photo'&&!AVE.img){ showToast('Choisis une photo'); return; }
  var av={type:AVE.type,bg:AVE.bg};
  if(AVE.type==='initials') av.text=(AVE.text||initialsOf(currentName)).slice(0,2);
  if(AVE.type==='emoji') av.emoji=AVE.emoji;
  if(AVE.type==='photo') av.img=AVE.img;
  if(AVE.type==='memoji') av.mj=AVE.mj;
  function done(a){
    AUTH.user.avatar=a;
    (AUTH.household.members||[]).forEach(function(m){ if(String(m.id)===currentUser) m.avatar=a; });
    closeSheet(); renderHome(); renderSettingsPage(); showToast('Avatar enregistré');
  }
  if(DEMO){ try{ localStorage.setItem('budget_demo_avatar',JSON.stringify(av)); }catch(e){} done(av); return; }
  apiPost('/api/auth/avatar',{avatar:av},function(err,d){ if(err||!d||!d.ok){ showToast((d&&d.error)||'Erreur'); return; } done(d.avatar); });
}
applyTheme();
authStart();
</script>
</body>
</html>
