<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Nunito:wght@500;600;700;800;900&display=swap');
:root{
  --bg:#f6e3e1;--surface:#fff;--border:#ecd8d4;--text:#2a2118;--muted:#8a7f72;
  --accent:#a8842c;--accent-light:#f5ecd6;--green:#2f8a55;--green-light:#e6f2e9;
  --red:#c8423b;--red-light:#f8e6e2;--orange:#ea580c;--purple:#7c3aed;
  --radius:10px;--shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;}
header{background:var(--text);color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.logo{display:flex;align-items:center;gap:9px;}
.logo h1{font-size:15px;font-weight:600;}
.logo span{font-size:10px;color:#94a3b8;}
.page{display:none;}
.page.active{display:block;}
.budget-layout{max-width:1040px;margin:0 auto;padding:20px 14px;display:grid;grid-template-columns:1fr 270px;gap:16px;}
@media(max-width:780px){.budget-layout{grid-template-columns:1fr;}}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;}
.card-header .ml{margin-left:auto;display:flex;align-items:center;gap:7px;}
.amount-input{font-family:'DM Mono',monospace;font-size:13px;text-align:right;width:115px;padding:4px 8px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text);outline:none;cursor:pointer;}
.amount-input:focus{border-color:var(--accent);background:var(--accent-light);cursor:text;}
.amount-input.zero{color:var(--muted);}
.tot-row.dep td:last-child{color:var(--red);}
.tot-row.rev td:last-child{color:var(--green);}
.solde-banner{margin:14px;padding:14px 18px;border-radius:var(--radius);display:flex;align-items:center;justify-content:space-between;}
.solde-banner.pos{background:var(--green-light);}
.solde-banner.neg{background:var(--red-light);}
.solde-banner .sl{font-size:13px;font-weight:600;}
.solde-banner .ss{font-size:10px;color:var(--muted);margin-top:2px;}
.solde-banner .sa{font-family:'DM Mono',monospace;font-size:22px;font-weight:700;letter-spacing:-1px;}
.solde-banner.pos .sa{color:var(--green);}
.solde-banner.neg .sa{color:var(--red);}
.ann-banner{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);}
.ann-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.ann-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:700;}
.kpi .kl{font-size:9.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px;}
.kpi .kv{font-family:'DM Mono',monospace;font-size:14px;font-weight:600;}
.kpi.red .kv{color:var(--red);}
.kpi.green .kv{color:var(--green);}
.kpi.blue .kv{color:var(--accent);}
.kpi.purple .kv{color:var(--purple);}
.prog-wrap{padding:10px 14px;}
.prog-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px;}
.prog-bar{height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;}
.ep-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;}
.ep-row:last-child{border-bottom:none;}
.ep-field{display:flex;flex-direction:column;align-items:flex-end;gap:1px;}
.ep-field label{font-size:9px;color:var(--muted);text-transform:uppercase;}
.ep-inp{font-family:'DM Mono',monospace;font-size:11px;width:70px;padding:3px 5px;border:1px solid var(--border);border-radius:4px;text-align:right;outline:none;}

.patri-val{font-size:52px;font-weight:800;letter-spacing:-1.5px;line-height:1;}
.patri-val small{font-size:.5em;letter-spacing:0;}
.patri-val.neg{color:var(--red);}
.patri-pill{width:42px;height:42px;border-radius:50%;background:#ebe3d6;color:#8a7a62;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;}
.patri-pill .ico{width:20px;height:20px;stroke-width:1.6;}

.acc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;}
.acc-card{position:relative;overflow:hidden;aspect-ratio:1.8;border-radius:16px;padding:14px 16px;color:#fff;cursor:pointer;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;border:none;font-family:inherit;
  box-shadow:0 6px 16px rgba(60,40,20,.18);}
.acc-card::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.18) 55%,transparent 70%);pointer-events:none;}
.acc-name{position:relative;z-index:1;font-size:17px;font-weight:800;letter-spacing:-.2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.acc-bal{position:relative;z-index:1;font-size:21px;font-weight:800;letter-spacing:-.3px;}
.acc-bal small{font-size:.62em;}
.acc-noir{background:linear-gradient(135deg,#0d1424,#27324a 55%,#0b0f1a);}
.acc-orange{background:linear-gradient(135deg,#f0a04b,#e07a28 60%,#c9601a);}
.acc-bleu{background:linear-gradient(135deg,#4f8fe8,#2c63c9 60%,#1d4596);}
.acc-vert{background:linear-gradient(135deg,#4dbb84,#2a9461 60%,#1c6e47);}
.acc-violet{background:linear-gradient(135deg,#9a7be6,#7353cc 60%,#55389f);}
.acc-rose{background:linear-gradient(135deg,#f08aa8,#d95f84 60%,#b64266);}
.acc-or{background:linear-gradient(135deg,#d6b25e,#b48d36 60%,#8f6c22);}
.acc-add{aspect-ratio:1.6;border-radius:16px;border:1.5px solid #e2d9cb;background:#f0dfdb;cursor:pointer;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#6f6455;font-size:15px;font-weight:600;}
.acc-add.solo{grid-column:1 / -1;width:calc(50% - 6px);justify-self:center;}
.acc-add .plus{width:44px;height:44px;border-radius:50%;background:#fff;color:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.05);}

.quick-actions{display:flex;justify-content:space-around;margin:28px 0 30px;}
.qa{display:flex;flex-direction:column;align-items:center;gap:10px;background:none;border:none;cursor:pointer;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);}
.qa-ic{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:3px solid #fff;
  box-shadow:0 4px 14px rgba(80,55,20,.12);transition:transform .15s;}
.qa:active .qa-ic{transform:scale(.93);}
.qa-ic .ico{width:28px;height:28px;stroke-width:2.4;}
.qa-ic.dep{background:radial-gradient(circle at 35% 30%,#fff3f1,#f6d3cd);color:#d8473c;}
.qa-ic.rev{background:radial-gradient(circle at 35% 30%,#f2fbf5,#cfeedb);color:#2f8a55;}
.qa-ic.tra{background:radial-gradient(circle at 35% 30%,#fffaf2,#f1e2c6);color:#9a6e2a;}

.txn-panel{background:var(--surface);border-radius:28px 28px 0 0;margin:0 -16px;padding:24px 18px 30px;min-height:300px;}
.txn-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.txn-panel-head h2{font-size:28px;font-weight:900;letter-spacing:-.5px;}
.round-btns{display:flex;gap:10px;}
.round-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid #e2d9cb;background:#fff;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.round-btn .ico{width:21px;height:21px;}
.tx-section{font-size:15px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#a99e90;margin:22px 0 10px;}
.tx-day{font-size:15px;font-weight:700;color:var(--text);margin:16px 0 8px;}
.tx-row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:16px;border:none;margin-bottom:10px;
  cursor:pointer;text-align:left;font-family:inherit;color:var(--text);box-shadow:0 2px 6px rgba(80,55,20,.06);}
.tx-row.dep{background:#f5e4df;}
.tx-row.rev{background:#e2f0e6;}
.tx-row.tra{background:#f1e8d8;}
.tx-row.soon{opacity:.8;}
.tx-icon{width:44px;height:44px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.tx-main{flex:1;min-width:0;}
.tx-label{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-sub{font-size:13.5px;color:#8a7f72;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
.tx-amt{background:#fff;border-radius:99px;padding:6px 12px;font-size:16px;font-weight:800;white-space:nowrap;flex-shrink:0;}
.tx-amt.dep{color:#b83a32;}
.tx-amt.rev{color:#2f8a55;}
.tx-amt.tra{color:#8a6a2f;}
.tx-empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14.5px;line-height:1.5;}
.see-all{display:block;width:100%;margin-top:8px;padding:13px;border-radius:14px;border:1.5px solid #e2d9cb;background:#fff;
  font-family:inherit;font-size:15px;font-weight:700;color:var(--accent);cursor:pointer;}

/* Fenetres du bas (ajout / compte / detail) */
.sheet-backdrop{display:none;position:fixed;inset:0;background:rgba(40,28,15,.4);z-index:800;align-items:flex-end;justify-content:center;}
.sheet-backdrop.open{display:flex;}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:sheetUp .22s ease-out;}
@keyframes sheetUp{from{transform:translateY(40px);opacity:.4;}to{transform:none;opacity:1;}}
@media(min-width:700px){.sheet-backdrop{align-items:center;}.sheet{border-radius:26px;}}
.sheet-grab{width:44px;height:5px;border-radius:99px;background:#d9cfc0;margin:0 auto 14px;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sheet-head h3{font-size:22px;font-weight:900;}
.sheet-close{width:36px;height:36px;border-radius:50%;border:none;background:#ebe3d6;color:var(--text);font-size:18px;cursor:pointer;}
.amt-field{display:flex;align-items:center;justify-content:center;gap:6px;background:#fff;border-radius:18px;padding:16px;margin-bottom:14px;}
.amt-field input{width:100%;max-width:240px;border:none;outline:none;background:none;text-align:right;font-family:inherit;font-size:42px;font-weight:800;color:var(--text);}
.amt-field span{font-size:30px;font-weight:800;color:var(--muted);}
.amt-field.dep input{color:#b83a32;}
.amt-field.rev input{color:#2f8a55;}
.sf{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
.sf label{font-size:13px;font-weight:700;color:var(--muted);}
.sf input,.sf select{font-family:inherit;font-size:16px;font-weight:600;padding:12px 14px;border:1.5px solid var(--border);border-radius:14px;background:#fff;color:var(--text);outline:none;width:100%;}
.sf input:focus,.sf select:focus{border-color:var(--accent);}
.sf-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.seg{display:flex;gap:8px;}
.seg button{flex:1;padding:11px;border-radius:12px;border:1.5px solid var(--border);background:#fff;font-family:inherit;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer;}
.seg button.on{border-color:var(--accent);background:var(--accent-light);color:#6b5115;}
.swatches{display:flex;gap:10px;flex-wrap:wrap;}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 0 0 1.5px var(--border);}
.swatch.on{box-shadow:0 0 0 3px var(--accent);}
.sheet-btn{width:100%;padding:15px;border-radius:16px;border:none;background:var(--accent);color:#fff;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-top:6px;}
.sheet-btn.ghost{background:#fff;color:var(--red);border:1.5px solid #ecd0ca;}
.sheet-note{font-size:13.5px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
.qk-pick{display:flex;gap:10px;margin:4px 0 14px;}
.qk-pick label{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;border-radius:16px;border:1.5px solid var(--border);background:#fff;font-weight:800;font-size:15px;color:var(--text);cursor:pointer;text-align:center;}
.qk-pick label span{font-size:26px;}
.qk-pick label small{font-size:12px;font-weight:600;color:var(--muted);}
.qk-pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
.qk-drop{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:230px;padding:28px 24px;border:2.5px dashed #d9c9a6;border-radius:22px;background:#fff;cursor:pointer;transition:border-color .15s,background .15s,transform .15s;}
.qk-drop:hover{border-color:var(--accent);}
.qk-drop.over{border-style:solid;border-color:var(--accent);background:var(--accent-light);box-shadow:0 0 0 6px rgba(168,132,44,.15);transform:scale(1.01);}
.qk-drop-ic{font-size:42px;line-height:1;margin-bottom:4px;}
.qk-drop b{font-size:19px;font-weight:900;color:var(--text);}
.qk-drop small{font-size:13.5px;color:var(--muted);max-width:340px;line-height:1.45;}
.qk-drop input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none;}
.qk-or{text-align:center;font-size:14px;color:var(--muted);margin:14px 0 6px;}
.qk-or a{color:var(--accent);font-weight:800;text-decoration:underline;text-underline-offset:3px;}
.qk-wait{text-align:center;padding:28px 0;color:var(--muted);font-weight:700;}
.qk-wait i{display:block;width:34px;height:34px;margin:0 auto 14px;border-radius:50%;border:3px solid var(--accent-light);border-top-color:var(--accent);animation:qkspin .9s linear infinite;}
@keyframes qkspin{to{transform:rotate(360deg);}}
.sheet.qk-wide{max-width:880px;}
.qk-sum{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 14px;}
.qk-sum button{font-family:inherit;font-size:13.5px;font-weight:800;padding:8px 14px;border-radius:99px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;}
.qk-sum button b{margin-left:4px;}
.qk-sum button.on{border-color:var(--accent);background:var(--accent-light);color:#6b5115;}
.qk-sum button.warn b{color:var(--orange);}
.qk-bar{display:flex;gap:12px;align-items:flex-end;margin-bottom:6px;}
.qk-bar .sf{flex:1;margin:0;}
.qk-list{max-height:min(56vh,620px);overflow:auto;margin:0 0 12px;}
.qk-row{border-bottom:1px solid var(--border);border-left:4px solid transparent;padding:10px 4px 10px 10px;}
.qk-line{display:grid;grid-template-columns:22px 1fr 90px 190px 110px;gap:12px;align-items:center;}
.qk-line input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0;}
.qk-line .qk-lab{min-width:0;font-family:inherit;font-size:15px;font-weight:700;border:none;border-bottom:1px dashed var(--border);background:transparent;color:var(--text);padding:3px 0;}
.qk-line .qk-date{font-size:13px;color:var(--muted);font-weight:700;}
.qk-line select{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:#fff;color:var(--text);min-width:0;}
.qk-amt{font-weight:800;white-space:nowrap;text-align:right;}
.qk-amt.dep{color:var(--red);} .qk-amt.rev{color:var(--green);}
.qk-row.off .qk-line{opacity:.45;}
.qk-row.off .qk-line .qk-lab{text-decoration:line-through;}
.qk-row.dup{background:linear-gradient(90deg,#fdf1e4,transparent 70%);border-left-color:var(--orange);}
.qk-row.dup.sure{border-left-color:var(--red);background:linear-gradient(90deg,var(--red-light),transparent 70%);}
.qk-flag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--orange);margin:2px 0 0 34px;cursor:pointer;background:none;border:none;font-family:inherit;padding:0;}
.qk-row.sure .qk-flag{color:var(--red);}
.qk-flag i{font-style:normal;color:var(--muted);font-weight:700;}
.qk-cmp{display:none;margin:10px 0 4px 34px;}
.qk-row.open .qk-cmp{display:block;}
.qk-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.qk-card{background:#fff;border:1.5px solid var(--border);border-radius:16px;padding:12px 14px;}
.qk-card h5{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;}
.qk-card h5 button{font-family:inherit;font-size:11.5px;font-weight:800;border:none;background:none;color:var(--accent);cursor:pointer;padding:0;text-transform:none;letter-spacing:0;}
.qk-card dl{display:grid;grid-template-columns:78px 1fr;gap:5px 10px;font-size:13.5px;}
.qk-card dt{color:var(--muted);font-weight:700;}
.qk-card dd{font-weight:700;color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;}
.qk-card dd.diff{background:#fdf1e4;color:#9a4a0b;border-radius:6px;padding:0 6px;margin-left:-6px;}
.qk-card dd.same::after{content:' ✓';color:var(--green);}
.qk-choice{display:flex;gap:10px;margin-top:10px;}
.qk-choice button{flex:1;font-family:inherit;font-size:14px;font-weight:800;padding:11px;border-radius:14px;border:1.5px solid var(--border);background:#fff;color:var(--muted);cursor:pointer;}
.qk-choice button.on.skip{border-color:var(--red);background:var(--red-light);color:var(--red);}
.qk-choice button.on.add{border-color:var(--green);background:var(--green-light);color:var(--green);}
.qk-map{background:#fff;border:1.5px solid var(--border);border-radius:18px;padding:12px 14px 6px;margin-bottom:14px;}
.qk-map h5{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.qk-map-r{display:grid;grid-template-columns:1fr 24px minmax(0,1.1fr);gap:10px;align-items:center;padding:8px 0;border-top:1px solid #f1e9de;}
.qk-map-r:nth-child(2){border-top:none;}
.qk-map-r div{display:flex;flex-direction:column;min-width:0;}
.qk-map-r b{font-size:15px;font-weight:800;}
.qk-map-r small{font-size:12px;color:var(--muted);font-weight:700;}
.qk-map-r select{font-family:inherit;font-size:14px;font-weight:700;padding:9px 10px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);min-width:0;}
.qk-map-r.off b,.qk-map-r.off small{opacity:.45;text-decoration:line-through;}
.qk-arrow{color:var(--muted);font-weight:800;text-align:center;}
.qk-src{font-style:normal;font-weight:700;color:var(--muted);}
.qk-labw{display:flex;align-items:center;gap:8px;min-width:0;}
.qk-labw .qk-lab{flex:1;}
.qk-tag{flex:none;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#efe7d8;color:#7a5c2e;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis;}
.qk-tra i{font-style:normal;font-weight:700;color:var(--muted);}
.qk-tra{font-size:12.5px;font-weight:800;color:#3f7fae;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qk-amt.tra{color:#3f7fae;}
.qk-foot{display:flex;gap:14px;align-items:center;}
.qk-foot p{flex:1;font-size:13.5px;color:var(--muted);font-weight:700;margin:0;}
.qk-foot .sheet-btn{width:auto;flex:none;padding:14px 26px;margin:0;}
.qk-foot .sheet-btn:disabled{opacity:.5;cursor:default;}
.qk-m{border-bottom:1px solid var(--border);padding:11px 2px;display:grid;grid-template-columns:24px 1fr auto;gap:2px 10px;align-items:center;}
.qk-m input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0;}
.qk-m .qk-lab{min-width:0;font-family:inherit;font-size:15.5px;font-weight:800;border:none;background:transparent;color:var(--text);padding:2px 0;}
.qk-m .qk-sub{grid-column:2/4;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700;min-width:0;}
.qk-m .qk-sub select{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);border:none;background:transparent;padding:0;max-width:46%;min-width:0;}
.qk-m.off .qk-lab,.qk-m.off .qk-amt{opacity:.45;}
.qk-m.off .qk-lab{text-decoration:line-through;}
.qk-badge{margin-left:auto;flex:none;font-family:inherit;font-size:12px;font-weight:800;border:none;border-radius:99px;padding:4px 9px;cursor:pointer;background:#fdf1e4;color:var(--orange);}
.qk-badge.sure{background:var(--red-light);color:var(--red);}
.qk-badge.done{background:#efe9df;color:var(--muted);}
.qk-check{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-size:15px;font-weight:800;padding:13px;border-radius:16px;border:1.5px solid var(--orange);background:#fdf1e4;color:#9a4a0b;cursor:pointer;margin-bottom:6px;}
.qk-check.done{border-color:var(--border);background:#fff;color:var(--muted);}
.qk-rv-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.qk-rv-top button{font-family:inherit;font-size:15px;font-weight:800;border:none;background:none;color:var(--accent);cursor:pointer;padding:6px 0;}
.qk-rv-top span{font-size:13px;font-weight:800;color:var(--muted);}
.qk-dots{display:flex;gap:5px;justify-content:center;margin-bottom:14px;}
.qk-dots i{width:7px;height:7px;border-radius:50%;background:#e2d9cb;}
.qk-dots i.on{background:var(--accent);width:18px;border-radius:99px;}
.qk-dots i.ok{background:#cdbf9f;}
.qk-rv h4{font-size:20px;font-weight:900;margin-bottom:4px;}
.qk-lvl{display:inline-block;font-size:12.5px;font-weight:800;border-radius:99px;padding:4px 10px;margin-bottom:14px;background:#fdf1e4;color:var(--orange);}
.qk-lvl.sure{background:var(--red-light);color:var(--red);}
.qk-tab{background:#fff;border:1.5px solid var(--border);border-radius:18px;overflow:hidden;margin-bottom:10px;}
.qk-tab .r{display:grid;grid-template-columns:72px 1fr 1fr 18px;gap:8px;padding:10px 12px;border-top:1px solid #f1e9de;font-size:13.5px;align-items:center;}
.qk-tab .r:first-child{border-top:none;background:#faf6ef;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 12px;}
.qk-tab .r b{font-weight:700;color:var(--muted);font-size:12.5px;}
.qk-tab .r span{font-weight:700;min-width:0;overflow-wrap:anywhere;}
.qk-tab .r.diff span{color:#9a4a0b;}
.qk-tab .r.diff{background:#fffaf3;}
.qk-tab .r em{font-style:normal;text-align:center;font-weight:800;color:var(--green);}
.qk-tab .r.diff em{color:var(--orange);}
.qk-other{display:block;width:100%;text-align:center;font-family:inherit;font-size:13px;font-weight:800;border:none;background:none;color:var(--accent);cursor:pointer;padding:4px 0 10px;}
.qk-rv-btns{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
.qk-rv-btns button{font-family:inherit;font-size:16px;font-weight:800;padding:15px;border-radius:16px;cursor:pointer;border:1.5px solid;}
.qk-rv-btns .skip{border-color:#ecd0ca;background:#fff;color:var(--red);}
.qk-rv-btns .add{border-color:#bfdcc9;background:#fff;color:var(--green);}
.qk-rv-btns .skip.on{background:var(--red-light);border-color:var(--red);}
.qk-rv-btns .add.on{background:var(--green-light);border-color:var(--green);}
@media(max-width:699px){
  .qk-map-r{grid-template-columns:1fr;gap:6px;}.qk-arrow{display:none;}
  .qk-list{max-height:none;overflow:visible;}
  .qk-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));background:var(--bg);margin:0 -20px;padding:12px 20px calc(14px + env(safe-area-inset-bottom));flex-direction:column;align-items:stretch;gap:8px;box-shadow:0 -8px 16px -12px rgba(40,28,15,.25);}
  .qk-foot p{text-align:center;}
  .qk-foot .sheet-btn{width:100%;}
}
}
.detail-top{display:flex;flex-direction:column;align-items:center;gap:8px;margin:4px 0 18px;}
.detail-top .tx-icon{width:60px;height:60px;font-size:30px;border-radius:16px;}
.detail-amt{font-size:34px;font-weight:900;}

/* Grand ecran : Budget et Stats sur deux colonnes (la carte principale a gauche, les listes a droite) */
@media(min-width:1100px){
  #page-budget .bg-body,#page-dashboard .bg-body{max-width:1180px;}
  #page-budget .bg-body:has(>:nth-child(2)),#page-dashboard .bg-body:has(>:nth-child(2)){display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);column-gap:28px;align-items:start;}
  #page-budget .bg-body:has(>:nth-child(2))>.bg-card:first-child,#page-dashboard .bg-body:has(>:nth-child(2))>.bg-card:first-child{grid-column:1;grid-row:1 / span 60;position:sticky;top:20px;}
  #page-budget .bg-body:has(>:nth-child(2))>*:not(:first-child),#page-dashboard .bg-body:has(>:nth-child(2))>*:not(:first-child){grid-column:2;}
  #page-budget .bg-body>:nth-child(2),#page-dashboard .bg-body>:nth-child(2){margin-top:62px;}
  /* vue Budget : graphique + analyse a gauche, alignes en haut sur « Revenus » et qui defilent avec la liste */
  #page-budget .bg-body:has(>:nth-child(2))>.bg-left:first-child{grid-column:1;grid-row:1 / span 60;margin-top:62px;}
  /* une seule carte (calendrier) : elle prend toute la largeur */
  #page-budget .bg-body:not(:has(>:nth-child(2))){max-width:980px;}
  #page-budget .bg-head,#page-dashboard .st-head{padding-bottom:70px;}
}

<script>
var THIS_YEAR = new Date().getFullYear();
var MONTHS = ['Janvier','Fevrier','Mars','Avril','Mai','Juin','Juillet','Aout','Septembre','Octobre','Novembre','Decembre'];

var DEFAULT_CATS = [
  {key:'loyer',label:'Loyer',group:'dep',icon:'🏠',builtin:true},
  {key:'courses',label:'Courses',group:'dep_var',icon:'🛒',builtin:true},
  {key:'coiffeur',label:'Coiffeur',group:'dep_var',icon:'✂️',builtin:true},
  {key:'telephone',label:'Telephone',group:'dep',icon:'📱',builtin:true},
  {key:'apple',label:'Abonnement Apple',group:'dep',icon:'🍎',builtin:true},
  {key:'sport',label:'Salle de sport',group:'dep',icon:'🏋️',builtin:true},
  {key:'banque',label:'Frais de banque',group:'dep',icon:'🏦',builtin:true},
  {key:'sante',label:'Sante',group:'dep_var',icon:'💊',builtin:true},
  {key:'restaurant',label:'Restaurant',group:'dep_var',icon:'🍽️',builtin:true},

  {key:'maison',label:'Achats maison',group:'dep_var',icon:'🛋️',builtin:true},

  {key:'bebe',label:'Depense bebe',group:'dep_var',icon:'👶',builtin:true},

  {key:'assurance_vie',label:'Assurance vie',group:'epargne',icon:'🛡️',builtin:true},
  {key:'lep',label:'LEP',group:'epargne',icon:'💰',builtin:true},
  {key:'epargne_sal',label:'Epargne salariale',group:'epargne',icon:'📈',builtin:true},
  {key:'compte_bebe',label:'Compte bebe',group:'rev',icon:'👶',builtin:true},
  {key:'salaire_m',label:'Salaire Monsieur',group:'rev',icon:'💼',builtin:true},
  {key:'salaire_f',label:'Salaire Madame',group:'rev',icon:'💼',builtin:true},
  {key:'autre_rev',label:'Autre revenu',group:'rev',icon:'➕',builtin:true}
];

var DEFAULT_BUDGET = {loyer:0,courses:300,coiffeur:20,telephone:155,apple:57,sport:0,banque:8,sante:130,restaurant:70,internet:0,maison:92,repas:0,facture:50,bebe:100,autres_dep:0,enveloppe:0,assurance_vie:200,lep:0,epargne_sal:0,compte_bebe:780,salaire_m:1500,salaire_f:753};

var currentPage = 'home';


// API layer
// Ouvert en double-cliquant sur le fichier : on passe par le serveur local
var API_BASE = location.protocol === 'file:' ? 'http://localhost:3003' : '';
var currentUser = '';

// ── Mode démo (lien GitHub Pages) : pas de serveur, les données restent sur cet appareil ──
var DEMO = /github\.io$/i.test(location.hostname) || /[?&]demo=1/.test(location.search);
function demoLoad(){
  var d=null; try{ d=JSON.parse(localStorage.getItem('budget_demo')||'null'); }catch(e){}
  d=d||{}; ['transactions','categories','recurring','accounts'].forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });
  ['budget','applied','epargne','settings'].forEach(function(k){ if(!d[k]||typeof d[k]!=='object') d[k]={}; });
  return d;
}
function demoSave(d){ try{ localStorage.setItem('budget_demo',JSON.stringify(d)); }catch(e){} }
function demoTxn(t){
  return { id:t.id||Date.now()+Math.random(), date:t.date, label:t.label, cat:t.cat||'', amount:parseFloat(t.amount)||0,
    type:t.type||'dep', bank:t.bank||'', need:t.need||'', auto:t.auto?1:0, transfer_pair:t.transfer_pair||null,
    created_by:currentUser, affect_year:t.affect_year||null,
    affect_month_num:t.affect_month_num!==undefined?t.affect_month_num:null,
    remb:t.remb?1:0, later_pay:t.later_pay?1:0, no_balance:t.no_balance?1:0, trip:t.trip||null,
    rec_key:t.rec_key||null, note:t.note||null };
}
function demoApi(method,path,data){
  var d=demoLoad(), m, id;
  function put(list,obj){ var i=list.findIndex(function(x){return String(x.id)===String(obj.id);}); if(i>=0) list[i]=obj; else list.push(obj); }
  function del(list,key,val){ return list.filter(function(x){ return String(x[key])!==String(val); }); }
  if(method==='GET'){
    if(path==='/api/transactions') return d.transactions.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:b.id-a.id; });
    if(path==='/api/budget') return d.budget;
    if(path==='/api/categories') return d.categories;
    if(path==='/api/recurring') return d.recurring;
    if(path==='/api/applied-months') return d.applied;
    if(path==='/api/epargne') return d.epargne;
    if(path==='/api/settings') return d.settings;
    if(path==='/api/accounts') return d.accounts.slice().sort(function(a,b){ return (a.sortOrder||0)-(b.sortOrder||0)||a.id-b.id; });
    return null;
  }
  if(method==='POST'){
    if(path==='/api/transactions'){ var t=demoTxn(data); put(d.transactions,t); demoSave(d); return {ok:true,id:t.id}; }
    if(path==='/api/transactions/bulk'){ (data.transactions||[]).forEach(function(x){ put(d.transactions,demoTxn(x)); }); demoSave(d); return {ok:true,count:(data.transactions||[]).length}; }
    if(path==='/api/budget'){ Object.keys(data||{}).forEach(function(k){ d.budget[k]=parseFloat(data[k])||0; }); demoSave(d); return {ok:true}; }
    if(path==='/api/categories'){
      (data.categories||[]).forEach(function(c){
        var o={key:c.key,label:c.label,group:c.group,icon:c.icon||'',builtin:!!c.builtin};
        var i=d.categories.findIndex(function(x){return x.key===c.key;}); if(i>=0){ o.builtin=d.categories[i].builtin; d.categories[i]=o; } else d.categories.push(o);
      });
      demoSave(d); return {ok:true};
    }
    if(path==='/api/recurring'){
      if(data.id){ // mise a jour d une operation reguliere existante
        var ex=d.recurring.find(function(x){ return String(x.id)===String(data.id); });
        if(ex){ ex.label=data.label; ex.cat=data.cat||''; ex.bank=data.bank||''; ex.amount=parseFloat(data.amount)||0; ex.day=parseInt(data.day)||1; ex.to_bank=data.to_bank||null; ex.kind=data.kind||null; }
        demoSave(d); return {ok:true,id:data.id};
      }
      id=d.recurring.reduce(function(mx,x){return Math.max(mx,x.id);},0)+1;
      d.recurring.push({id:id,label:data.label,cat:data.cat||'',bank:data.bank||'',amount:parseFloat(data.amount)||0,day:parseInt(data.day)||1,
        next_month:parseInt(data.next_month)||0,to_bank:data.to_bank||null,start_key:data.start_key||null,
        kind:data.kind||null,freq:data.freq||null,every:parseInt(data.every)||null,anchor:data.anchor||null,end_date:data.end_date||null});
      demoSave(d); return {ok:true,id:id};
    }
    if((m=path.match(/^\/api\/settings\/(.+)$/))){ d.settings[decodeURIComponent(m[1])]=data.value; demoSave(d); return {ok:true}; }
    if((m=path.match(/^\/api\/applied-months\/(.+)$/))){ d.applied[decodeURIComponent(m[1])]=true; demoSave(d); return {ok:true}; }
    if((m=path.match(/^\/api\/epargne\/(.+)$/))){ d.epargne[decodeURIComponent(m[1])]={verse:parseFloat(data.verse)||0,objectif:parseFloat(data.objectif)||0}; demoSave(d); return {ok:true}; }
    if(path==='/api/accounts/order'){ (data.ids||[]).forEach(function(x,i){ d.accounts.forEach(function(a){ if(String(a.id)===String(x)) a.sortOrder=i; }); }); demoSave(d); return {ok:true}; }
    if(path==='/api/accounts'){
      id=data.id||Date.now();
      put(d.accounts,{id:id,name:data.name,color:data.color||'',solde:parseFloat(data.solde)||0,soldeDate:data.soldeDate||null,
        soldeSetAt:data.soldeSetAt||null,sortOrder:parseInt(data.sortOrder)||0,bank:data.bank||'',type:data.type||'',
        description:data.description||'',hidden:!!data.hidden,cycle:data.cycle||'',owner:data.owner||'',currency:data.currency||''});
      demoSave(d); return {ok:true,id:id};
    }
    return {ok:true};
  }
  if(method==='DELETE'){
    if((m=path.match(/^\/api\/transactions\/(.+)$/))) d.transactions=del(d.transactions,'id',decodeURIComponent(m[1]));
    else if((m=path.match(/^\/api\/recurring\/(.+)$/))) d.recurring=del(d.recurring,'id',decodeURIComponent(m[1]));
    else if((m=path.match(/^\/api\/accounts\/(.+)$/))) d.accounts=del(d.accounts,'id',decodeURIComponent(m[1]));
    else if((m=path.match(/^\/api\/categories\/(.+)$/))) d.categories=d.categories.filter(function(x){ return x.builtin||x.key!==decodeURIComponent(m[1]); });
    demoSave(d); return {ok:true};
  }
  return null;
}
if(DEMO){
  var _ls=document.querySelector('#loginScreen .login-sub');
  if(_ls) _ls.innerHTML='Mode démo — les données restent sur cet appareil';
}
var _cache = {txns:null,budget:null,cats:null,recurring:null,applied:null,epargne:null,accounts:null};

function syncBar(on){ var b=document.getElementById('syncBar'); if(b) b.className=on?'sync-bar loading':'sync-bar'; }

function apiGet(path,cb){
  if(DEMO){ setTimeout(function(){ var r=demoApi('GET',path); if(r===null) cb(new Error('HTTP 404')); else cb(null,JSON.parse(JSON.stringify(r))); },0); return; }
  syncBar(true); var xhr=new XMLHttpRequest(); xhr.open('GET',API_BASE+path,true);
  xhr.setRequestHeader('Authorization','Bearer '+AUTH.token);
  xhr.onload=function(){ syncBar(false); if(xhr.status===401){ authExpired(); cb(new Error('HTTP 401')); return; } if(xhr.status===200){var d; try{d=cleanIds(JSON.parse(xhr.responseText));}catch(e){cb(e);return;} cb(null,d);}else{cb(new Error('HTTP '+xhr.status));} };
  xhr.onerror=function(){ syncBar(false); cb(new Error('reseau')); };
  xhr.send();
}
// Regle du foyer : le serveur a refuse de toucher au compte d un autre membre -> message, puis on recharge les vraies donnees
var LOCK_MSG='🔒 Ce compte appartient à un autre membre du foyer : l’admin du foyer n’autorise pas à le modifier.', _lockT=0;
function lockRefused(xhr){
  if(xhr.status!==403) return false;
  var d={}; try{ d=JSON.parse(xhr.responseText); }catch(e){}
  if(!d.locked) return false;
  setTimeout(function(){ showToast(LOCK_MSG); },60); // apres le message d erreur eventuel de l appelant
  clearTimeout(_lockT); _lockT=setTimeout(function(){ refreshMe(function(){ loadAllData(function(){ refreshViews(); }); }); },400);
  return true;
}
// Ce compte appartient-il a un autre membre alors que l admin du foyer ne permet pas d y toucher ?
function accLocked(id){
  var h=AUTH&&AUTH.household; if(!h||h.membersEdit!==false||id==null||id==='') return false;
  var a=getAccounts().filter(function(x){ return String(x.id)===String(id); })[0];
  if(!a||!a.owner||String(a.owner)===String(currentUser)) return false;

var TOUR=null;
function tourKey(){ return 'budget_tour_'+(currentUser||''); }
function tourSeen(){ try{ return JSON.parse(localStorage.getItem(tourKey())||'{}')||{}; }catch(e){ return {}; } }
function tourMark(page){ var d=tourSeen(); d[page]=1; try{ localStorage.setItem(tourKey(),JSON.stringify(d)); }catch(e){} }
function tourMaybe(page){
  if(!TOURS[page]||tourSeen()[page]) return;
  setTimeout(function(){
    // Pas de visite si une fenetre est ouverte ou si on a change de page entre-temps
    if(currentPage!==page||TOUR||document.querySelector('.sheet-backdrop.open,.am-backdrop.open')) return;
    var ls=document.getElementById('loginScreen'); if(ls&&ls.style.display!=='none') return;
    tourStart(page);
  },900);
}
function tourStart(page){
  if(currentPage!==page){ switchPage(page); setTimeout(function(){ tourStart(page); },700); return; }
  tourMark(page);
  var el=document.getElementById('tour');
  if(!el){ el=document.createElement('div'); el.id='tour'; el.className='tour'; document.body.appendChild(el); }
  el.innerHTML='<div class="tour-hole none"></div><div class="tour-tip"></div>';
  el.style.display='';
  TOUR={page:page,i:-1};
  tourGo(1);
}
function tourEl(st){
  if(!st.s) return null;
  var e=document.querySelector(st.s);
  return e&&e.offsetParent?e:null;
}
function tourGo(dir){
  var steps=TOURS[TOUR.page], i=TOUR.i;
  // On saute les etapes dont l element n existe pas (ex : aucun compte encore)
  do{
    i+=dir;
    if(i>=steps.length){ tourEnd(); return; }
    if(steps[i].pre) steps[i].pre();
  } while(steps[i].s&&!tourEl(steps[i]));
  TOUR.i=i;
  var st=steps[i], target=tourEl(st), root=document.getElementById('tour');
  var hole=root.querySelector('.tour-hole'), tip=root.querySelector('.tour-tip');
  var last=true;
  for(var n=i+1;n<steps.length;n++) if(!steps[n].s||steps[n].pre||tourEl(steps[n])){ last=false; break; }
  tip.innerHTML='<div class="tt-step">Visite guidée</div><h3>'+st.t+'</h3><p>'+st.x+'</p>'+
    '<div class="tour-foot"><span class="tour-num">'+(i+1)+' / '+steps.length+'</span>'+
    (last?'':'<button class="tour-skip" onclick="tourEnd()">Passer</button>')+
    '<button class="tour-next" onclick="tourGo(1)">'+(last?'C’est parti !':'Suivant')+'</button></div>';
  if(!target){ hole.classList.add('none'); tip.style.top=Math.max(16,(window.innerHeight-tip.offsetHeight)/2)+'px'; return; }
  hole.classList.remove('none');
  target.scrollIntoView({block:'center'});
  var r=target.getBoundingClientRect(), pad=8, vh=window.innerHeight;
  var top=Math.max(4,r.top-pad), bot=Math.min(vh-4,r.bottom+pad);
  hole.style.left=(r.left-pad)+'px'; hole.style.top=top+'px';
  hole.style.width=(r.width+pad*2)+'px'; hole.style.height=(bot-top)+'px';
  var th=tip.offsetHeight;
  // La bulle va en dessous si elle tient, sinon au-dessus, sinon en bas de l ecran
  if(bot+16+th<vh-8) tip.style.top=(bot+16)+'px';
  else if(top-16-th>8) tip.style.top=(top-16-th)+'px';
  else tip.style.top=(vh-th-90)+'px';
}
function tourEnd(){
  var el=document.getElementById('tour'); if(el){ el.style.display='none'; el.innerHTML=''; }
  TOUR=null; window.scrollTo(0,0);
}

// Solde = solde saisi + mouvements posterieurs a la saisie (hors operations a venir)
function accountBalance(acc){
  var bal=parseFloat(acc.solde)||0, today=todayStr(), txns=getTxns();
  for(var i=0;i<txns.length;i++){
    var t=txns[i];
    if(String(t.bank)!==String(acc.id)) continue;
    if(t.date>today||Number(t.no_balance)||Number(t.later_pay)) continue;
    var afterSet=Number(t.id)>Number(acc.soldeSetAt||0) || (acc.soldeDate&&t.date>acc.soldeDate);
    if(!afterSet) continue;
    bal+=txnSign(t)*(parseFloat(t.amount)||0);
  }
  return Math.round(bal*100)/100;
}

// Solde prevu a la fin du mois : solde actuel + operations a venir du mois (transactions futures et echeances non confirmees)
// Periode en cours d un compte : son mois de paie s il en a un, sinon le mois calendaire
function accountPeriod(acc){
  var now=new Date();
  return (acc.cycle&&cycleRangeAt(acc.cycle,todayStr()))||calRange(now.getFullYear(),now.getMonth());
}
function accountProjected(acc){
  var bal=accountBalance(acc), id=String(acc.id), per=accountPeriod(acc);
  var end=per.end, txns=getTxns();
  for(var i=0;i<txns.length;i++){
    var t=txns[i];
    if(String(t.bank)!==id||Number(t.no_balance)||!isPending(t)||t.date>end) continue;
    if(t.type==='rev') continue; // un revenu ne compte qu une fois recu (confirme)
    bal+=txnSign(t)*(parseFloat(t.amount)||0);
  }
  var occ=rangeOccs(per);
  for(var o=0;o<occ.length;o++){
    var oc=occ[o]; if(oc.done) continue;
    if(oc.kind==='tra'){ if(String(oc.bank)===id) bal-=oc.amount; if(String(oc.r.to_bank)===id) bal+=oc.amount; }
    else if(oc.kind==='dep'&&String(oc.bank)===id) bal-=oc.amount; // revenus reguliers : comptes seulement une fois confirmes
  }
  return Math.round(bal*100)/100;
}

// ---------- Reste a vivre et soldes bas ----------
// Comptes du quotidien de la personne connectee : les siens et les communs (tous quand on est seul)
// Comptes choisis a la main par la personne (reglage du foyer rvAccs : {idPersonne: [idsComptes]}), sinon null
function rvChosen(){ var c=((_cache.settings||{}).rvAccs||{})[String(currentUser)]; return Array.isArray(c)?c.map(String):null; }
function rvAccounts(){
  var ms=hhMembers().map(function(m){ return String(m.id); }), me=String(currentUser), ch=rvChosen();
  if(ch) return getAccounts().filter(function(a){ return !a.hidden&&ch.indexOf(String(a.id))>=0; });
  return getAccounts().filter(function(a){
    if(a.hidden||(a.type||'quotidien')!=='quotidien') return false;
    return ms.length<2||!a.owner||String(a.owner)===me||ms.indexOf(String(a.owner))<0;
  });
}
// Fin de la periode : veille de ma prochaine paie (sinon celle du mois du budget, sinon fin du mois)
function rvPay(){
  var me=String(currentUser), pays=payList(), r=pays.filter(function(x){ var o=payOwner(x); return o&&String(o.id)===me; })[0];
  var hc=householdCycle();
  if(!r&&hc&&!/^(cal|r:|mix:)/.test(String(hc))) r=payById(hc);
  if(!r&&isMix(hc)) r=payById(mixParts(hc).a);
  if(!r&&hhMembers().length<2&&pays.length) r=pays.slice().sort(function(a,b){ return b.amount-a.amount; })[0]; // seul : la plus grosse paie
  if(!r) return null;
  var d=new Date(), today=todayStr(), nx=payDates(r.id,d.getFullYear(),d.getMonth()).filter(function(x){ return x>today; })[0];
  return nx?{r:r,date:nx}:null;
}
function resteAVivre(){
  var accs=rvAccounts(); if(!accs.length&&!rvChosen()) return null;
  var ids=accs.map(function(a){ return String(a.id); }), inS=function(b){ return ids.indexOf(String(b))>=0; };
  var today=todayStr(), d=new Date(), pay=rvPay(), end=pay?addDays(pay.date,-1):mPrefix(d.getFullYear(),d.getMonth())+'-'+pad(daysIn(d.getFullYear(),d.getMonth()));
  if(end<today) end=today;
  var bal=0; accs.forEach(function(a){ bal+=toMain(accountBalance(a),a.id); });
  var items=[];
  getTxns().forEach(function(t){
    if(!inS(t.bank)||Number(t.no_balance)||!isPending(t)||t.date>end||t.type==='rev') return;
    var p=t.transfer_pair&&getTxns().filter(function(x){ return String(x.id)===String(t.transfer_pair); })[0];
    if(p&&inS(p.bank)) return; // virement entre deux comptes du quotidien : ne change rien
    items.push({date:t.date,label:t.label,v:txnSign(t)*amtMain(t)});
  });
  // echeances pas encore confirmees depuis le debut du mois en cours (une echeance en retard reste a payer)
  var per=cycleRangeAt(householdCycle(),today)||calRange(d.getFullYear(),d.getMonth());
  rangeOccs({start:per.start<today?per.start:today,end:end}).forEach(function(oc){
    if(oc.done||oc.kind==='rev') return;
    var v=0, a=toMain(oc.amount,oc.bank);
    if(oc.kind==='dep'&&inS(oc.bank)) v=-a;
    else if(oc.kind==='tra'){ var f=inS(oc.bank), t2=inS(oc.r.to_bank); if(f&&!t2) v=-a; else if(!f&&t2) v=a; }
    if(v) items.push({date:oc.date<today?today:oc.date,label:oc.label,v:v,late:oc.date<today});
  });
  items.sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  var spend=items.reduce(function(s,x){ return s+x.v; },0), reste=Math.round((bal+spend)*100)/100;
  var days=Math.round((parseDs(end)-parseDs(today))/86400000)+1;
  return {accs:accs,bal:Math.round(bal*100)/100,items:items,reste:reste,end:end,days:days,perDay:reste/days,pay:pay};
}
// Comptes du quotidien qui risquent de passer sous zero dans les 30 jours (operations prevues, revenus reguliers compris)
function lowBalanceRisks(){
  var today=todayStr(), end=addDays(today,30), d=new Date(), out=[];
  var per=cycleRangeAt(householdCycle(),today)||calRange(d.getFullYear(),d.getMonth());
  var occ=rangeOccs({start:per.start<today?per.start:today,end:end}).filter(function(o){ return !o.done; });
  getAccounts().forEach(function(a){
    if(a.hidden||(a.type||'quotidien')!=='quotidien') return;
    var id=String(a.id), ev=[];
    getTxns().forEach(function(t){ if(String(t.bank)===id&&!Number(t.no_balance)&&isPending(t)&&t.date<=end) ev.push([t.date>today?t.date:today,txnSign(t)*(parseFloat(t.amount)||0)]); });
    occ.forEach(function(o){
      var dt=o.date<today?(o.kind==='rev'?addDays(today,1):today):o.date, v=0;
      if(o.kind==='tra'){ if(String(o.bank)===id) v=-o.amount; if(String(o.r.to_bank)===id) v+=o.amount; }
      else if(String(o.bank)===id) v=o.kind==='rev'?o.amount:-o.amount;
      if(v) ev.push([dt,v]);
    });
    ev.sort(function(x,y){ return x[0]<y[0]?-1:x[0]>y[0]?1:y[1]-x[1]; }); // le meme jour, les rentrees d argent d abord
    var bal=accountBalance(a), first=bal<-0.004?today:null, min=bal;
    ev.forEach(function(e){ bal+=e[1]; if(bal<min) min=bal; if(bal<-0.004&&!first) first=e[0]; });
    if(first) out.push({acc:a,date:first,min:Math.round(min*100)/100});
  });
  return out;
}

function ordDown(e,card){
  if(e.button>0) return;
  if(!ORD.on){
    // appui long (0,5 s sans bouger) : passe en mode ordre
    var x0=e.clientX, y0=e.clientY;
    clearTimeout(ORD.timer);
    ORD.timer=setTimeout(function(){ ORD.justLong=true; ordStart(); if(navigator.vibrate) navigator.vibrate(15); },500);
    var cancel=function(ev){ if(ev.type!=='pointermove'||Math.abs(ev.clientX-x0)+Math.abs(ev.clientY-y0)>10){ clearTimeout(ORD.timer); off(); } };
    var off=function(){ ['pointermove','pointerup','pointercancel'].forEach(function(t){ window.removeEventListener(t,cancel); }); };
    ['pointermove','pointerup','pointercancel'].forEach(function(t){ window.addEventListener(t,cancel); });
    return;
  }
  e.preventDefault();
  var r=card.getBoundingClientRect();
  ORD.drag={card:card,dx:e.clientX-r.left,dy:e.clientY-r.top};
  card.classList.add('ord-drag');
  card.setPointerCapture(e.pointerId);
  card.onpointermove=function(ev){ ordMove(ev); };
  card.onpointerup=card.onpointercancel=function(){ ordDrop(); };
  ordMove(e);
}
function ordMove(e){
  var d=ORD.drag; if(!d) return;
  var c=d.card;
  c.style.transform=''; var r=c.getBoundingClientRect();
  // carte survolee : on y deplace la carte tenue
  var under=document.elementsFromPoint(e.clientX,e.clientY).filter(function(el){ return el!==c&&!c.contains(el); })
    .map(function(el){ return el.closest&&el.closest('#accGrid .acc-card[data-id]'); }).filter(Boolean)[0];
  if(under&&under!==c){
    var cards=[].slice.call(document.querySelectorAll('#accGrid .acc-card[data-id]'));
    var from=cards.indexOf(c), to=cards.indexOf(under);
    under.parentNode.insertBefore(c,from<to?under.nextSibling:under);
    r=c.getBoundingClientRect();
  }
  c.style.transform='translate('+(e.clientX-d.dx-r.left)+'px,'+(e.clientY-d.dy-r.top)+'px) scale(1.04)';
}
function ordDrop(){
  var d=ORD.drag; if(!d) return;
  d.card.style.transform=''; d.card.classList.remove('ord-drag');
  d.card.onpointermove=d.card.onpointerup=d.card.onpointercancel=null;
  ORD.drag=null;
}

    var row=upItems[u].occ?makeHomeOccRow(upItems[u].occ):makeHomeTxnRow(upItems[u].t,true);
    if(upItems[u].occ) row.onclick=(function(k){ return function(){ closeAccModal(); bgOpenOcc(k); }; })(upItems[u].occ.key);
    else row.onclick=(function(tid){ return function(){ closeAccModal(); openTxnEdit(tid); }; })(upItems[u].t.id);
    upEl.appendChild(row);
  }
  var pastEl=document.getElementById('avPast'), lastDay='';
  if(!past.length) pastEl.innerHTML='<div class="bg-empty">Aucune opération sur ce compte pour l’instant.</div>';
  for(var k=0;k<Math.min(past.length,15);k++){
    if(past[k].date!==lastDay){ lastDay=past[k].date; var dh=document.createElement('div'); dh.className='tx-day'; dh.textContent=dayLabel(lastDay); pastEl.appendChild(dh); }
    var r=makeHomeTxnRow(past[k],false);
    r.onclick=(function(tid){ return function(){ closeAccModal(); openTxnEdit(tid); }; })(past[k].id);
    pastEl.appendChild(r);
  }
  m.classList.add('open');
}
function makeHomeTxnRow(t, soon, merge){
  var cat=getCatObj(t.cat), kind=txnKind(t), pair=merge&&t.type==='transfert'?txnPair(t):null;
  var row=document.createElement('button');
  row.className='tx-row '+kind+(soon?' soon':'');
  var sub;
  if(Number(t.later_pay)) sub='À payer'+(t.bank?' · '+accountName(t.bank):'');
  else if(soon) sub=daysUntil(t.date);
  else if(pair) sub=accountName(t.bank)+' → '+accountName(pair.bank);
  else if(kind==='tra') sub=(t.type==='transfert'?'Virement sortant':'Virement entrant')+(t.bank?' · '+accountName(t.bank):'');
  else sub=cat.label+(t.bank?' · '+accountName(t.bank):'');
  if(Number(t.no_balance)) sub+=' · hors solde';
  var shop=kind==='tra'?null:findMerchant(t.label);
  row.innerHTML=(kind==='tra'?'<span class="tx-icon">⇄</span>':(shop&&LOGOS['m:'+shop[0]]?'<span class="tx-icon img"><img src="'+LOGOS['m:'+shop[0]]+'" alt=""></span>':catIconHtml(cat,'tx-icon')))+
    '<span class="tx-main"><div class="tx-label">'+esc(t.label)+'</div><div class="tx-sub">'+esc(sub)+'</div></span>'+
    '<span class="tx-amt '+kind+'">'+(pair?'':(txnSign(t)>0?'+ ':'– '))+fmtEur(parseFloat(t.amount)||0,bankCur(t.bank))+'</span>';
  row.onclick=function(){ openTxnEdit(t.id); };
  return row;
}

// Echeance reguliere sur l accueil : meme fenetre de confirmation que dans le Budget
function makeHomeOccRow(oc){
  var row=document.createElement('button'), late=oc.date<=todayStr()||oc.kind==='rev', kind=oc.kind==='rev'?'rev':(oc.kind==='tra'?'tra':'dep');
  row.className='tx-row '+kind+' soon';
  row.innerHTML=itemIcon(oc.label,oc.cat,oc.kind,'tx-icon')+
    '<span class="tx-main"><div class="tx-label">'+esc(oc.label)+'</div><div class="tx-sub">'+(late?'<i class="bc-badge">À confirmer</i>'+(oc.date>todayStr()?relDay(oc.date):''):'Prévu '+relDay(oc.date).toLowerCase())+(oc.bank?' · '+esc(accountName(oc.bank)):'')+'</div></span>'+
    '<span class="tx-amt '+kind+'">'+(oc.kind==='rev'?'+ ':'– ')+fmtEur(oc.amount,bankCur(oc.bank))+'</span>';
  row.onclick=function(){ bgOpenOcc(oc.key); };
  return row;
}
function renderHomeTxns(){
  var el=document.getElementById('homeTxns'); el.innerHTML='';
  var today=todayStr(), txns=getTxns().slice(), upcoming=[], past=[];
  for(var i=0;i<txns.length;i++){ (txns[i].date>today||Number(txns[i].later_pay)?upcoming:past).push(txns[i]); }
  if(!txns.length&&!regulars().length){
    el.innerHTML='<div class="tx-empty">Aucune transaction pour l’instant.<br>Commence par créer un compte, puis ajoute une dépense ou un revenu avec les boutons ci-dessus.</div>';
    return;
  }
  // echeances regulieres pas encore confirmees (ce mois-ci et le mois prochain, 30 jours max)
  var lim=new Date(); lim.setDate(lim.getDate()+30); var limS=dsOf(lim), nm=new Date(); nm.setDate(1); nm.setMonth(nm.getMonth()+1);
  var occ=occurrences(new Date().getFullYear(),new Date().getMonth()).concat(occurrences(nm.getFullYear(),nm.getMonth()));
  for(var o=0;o<occ.length;o++){ if(!occ[o].done&&occ[o].date<=limS) upcoming.push({occ:occ[o],date:occ[o].date}); }
  if(upcoming.length){
    upcoming.sort(function(a,b){return a.date.localeCompare(b.date);});
    var h=document.createElement('div'); h.className='tx-section'; h.textContent='À venir'; el.appendChild(h);
    for(var u=0;u<Math.min(upcoming.length,6);u++) el.appendChild(upcoming[u].occ?makeHomeOccRow(upcoming[u].occ):makeHomeTxnRow(upcoming[u],true));
  }
  past.sort(function(a,b){ return b.date.localeCompare(a.date)||(Number(b.id)-Number(a.id)); });
  var shown=mergeTransfers(past).slice(0,30), lastDay='';
  if(shown.length&&upcoming.length){ var h2=document.createElement('div'); h2.className='tx-section'; h2.textContent='Récentes'; el.appendChild(h2); }
  for(var k=0;k<shown.length;k++){
    if(shown[k].date!==lastDay){
      lastDay=shown[k].date;
      var dh=document.createElement('div'); dh.className='tx-day'; dh.textContent=dayLabel(lastDay); el.appendChild(dh);
    }
    el.appendChild(makeHomeTxnRow(shown[k],false,true));
  }
  var more=document.createElement('button'); more.className='see-all'; more.textContent='Voir toutes les transactions';
  more.onclick=function(){ openJournal(false); };
  el.appendChild(more);
}

// ---------- Journal complet : toutes les operations d un mois, recherche et filtres ----------
var J={y:new Date().getFullYear(),m:new Date().getMonth(),q:'',kind:'all',acc:'all'};
function openJournal(focusSearch){
  J.q=''; J.kind='all'; J.acc='all'; J.y=new Date().getFullYear(); J.m=new Date().getMonth();
  switchPage('journal');
  if(focusSearch) setTimeout(function(){ var s=document.getElementById('jSearch'); if(s) s.focus(); },300);
}
function openAccountJournal(id){ openJournal(false); J.acc=String(id); renderJournal(); }
function jMove(n){ J.m+=n; if(J.m<0){ J.m=11; J.y--; } if(J.m>11){ J.m=0; J.y++; } renderJournal(); }
// Le transfert « entrant » est cache quand sa moitie « sortante » est affichee : une seule ligne par transfert
function txnPair(t){ if(!t.transfer_pair) return null; var a=getTxns(); for(var i=0;i<a.length;i++) if(String(a[i].id)===String(t.transfer_pair)) return a[i]; return null; }
function mergeTransfers(list){
  var ids={}; for(var i=0;i<list.length;i++) if(list[i].type==='transfert') ids[String(list[i].id)]=1;
  return list.filter(function(t){ return !(t.type==='transfert_in'&&t.transfer_pair&&ids[String(t.transfer_pair)]); });
}
function renderJournal(){
  var root=document.getElementById('jRoot'); if(!root) return;
  var q=normTxt(J.q.trim()), all=getTxns(), list=[], dep=0, rev=0;
  for(var i=0;i<all.length;i++){
    var t=all[i], k=txnKind(t);
    // avec une recherche, on cherche dans tous les mois
    if(!q){ var d=parseDs(t.date); if(d.getFullYear()!==J.y||d.getMonth()!==J.m) continue; }
    if(J.acc!=='all'&&String(t.bank)!==String(J.acc)) continue;
    if(J.kind!=='all'&&k!==J.kind) continue;
    if(q&&normTxt(t.label).indexOf(q)<0&&normTxt(getCatObj(t.cat).label).indexOf(q)<0&&normTxt(t.note||'').indexOf(q)<0) continue;
    list.push(t);
    if(k==='dep') dep+=amtMain(t); else if(k==='rev') rev+=amtMain(t);
  }
  if(J.acc==='all') list=mergeTransfers(list);
  list.sort(function(a,b){ return b.date.localeCompare(a.date)||(Number(b.id)-Number(a.id)); });
  var sol=rev-dep, pm=(J.m+11)%12, nm=(J.m+1)%12;
  var kinds=[['all','Tout'],['dep','Dépenses'],['rev','Revenus'],['tra','Transferts']], kh='';
  for(var j=0;j<kinds.length;j++) kh+='<button class="pv-chip'+(J.kind===kinds[j][0]?' on':'')+'" onclick="J.kind=\''+kinds[j][0]+'\';renderJournal()">'+kinds[j][1]+'</button>';
  var accs=getAccounts(), ah='<button class="pv-chip'+(J.acc==='all'?' on':'')+'" onclick="J.acc=\'all\';renderJournal()">Tous les comptes</button>';
  for(var a=0;a<accs.length;a++) ah+='<button class="pv-chip'+(String(J.acc)===String(accs[a].id)?' on':'')+'" onclick="J.acc=\''+accs[a].id+'\';renderJournal()">'+accChip(accs[a])+'</button>';
  root.innerHTML='<div class="bg-head j-head"><div class="j-top"><button class="j-back" onclick="switchPage(\'home\')" title="Retour">'+
      '<svg class="ico" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>Toutes les opérations</b><span></span></div>'+
      (q?'<div class="bg-months"><b>Recherche</b></div>':'<div class="bg-months"><button onclick="jMove(-1)">'+MONTHS_SHORT[pm]+'</button><b>'+MONTHS_SHORT[J.m]+' '+J.y+'</b><button onclick="jMove(1)">'+MONTHS_SHORT[nm]+'</button></div>')+'</div>'+
    '<div class="bg-body"><div class="bg-card j-card">'+
      '<div class="bg-tiles three"><div><span>Dépenses</span><b class="red">'+fmtE(dep)+'</b></div><div><span>Revenus</span><b class="green">'+fmtE(rev)+'</b></div>'+
      '<div><span>Solde</span><b class="'+(sol<0?'red':'dgreen')+'">'+(sol>0?'+':'')+fmtE(sol)+'</b></div></div>'+
      '<label class="wiz-search j-search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="jSearch" placeholder="Rechercher une opération…" autocomplete="off">'+
        (q?'<button onclick="J.q=\'\';renderJournal()" title="Effacer">✕</button>':'')+'</label>'+
      '<div class="pv-chips j-chips">'+kh+'</div>'+(accs.length>1?'<div class="pv-chips j-chips">'+ah+'</div>':'')+
    '</div><div class="j-list" id="jList"></div></div>';
  var s=document.getElementById('jSearch'); s.value=J.q;
  s.oninput=function(){ var pos=s.selectionStart; J.q=s.value; renderJournal(); var n=document.getElementById('jSearch'); n.focus(); try{ n.setSelectionRange(pos,pos); }catch(e){} };
  var el=document.getElementById('jList'), last='';
  if(!list.length){ el.innerHTML='<div class="tx-empty">'+(q?'Aucune opération trouvée.':'Aucune opération ce mois-ci.')+'</div>'; return; }
  if(q){ var c=document.createElement('div'); c.className='tx-section'; c.textContent=list.length+' résultat'+(list.length>1?'s':''); el.appendChild(c); }
  for(var r=0;r<list.length;r++){
    if(list[r].date!==last){ last=list[r].date; var dh=document.createElement('div'); dh.className='tx-day'; var dl=dayLabel(last); dh.textContent=dl+(q&&/^\d/.test(dl)?' '+parseDs(last).getFullYear():''); el.appendChild(dh); }
    el.appendChild(makeHomeTxnRow(list[r],false,J.acc==='all'));
  }
}

// ---------- Ajout depense / revenu ----------
var sheetNeed='';
function openTxnSheet(kind){
  var cats=getCats(), opts='';
  for(var i=0;i<cats.length;i++){
    var c=cats[i];
    if(kind==='rev'?c.group!=='rev':c.group==='rev') continue;

  }

  openSheet(sheetHead(kind==='rev'?'Nouveau revenu':'Nouvelle dépense')+
    '<div class="amt-field '+kind+'"><input type="number" id="shAmount" inputmode="decimal" step="0.01" min="0" placeholder="0"><span>€</span></div>'+
    '<div class="sf"><label>Libellé</label><input type="text" id="shLabel" placeholder="'+(kind==='rev'?'Ex : Salaire':'Ex : Carrefour')+'"></div>'+
    '<div class="sf"><label>Catégorie</label><select id="shCat" onchange="sheetCatChanged()">'+opts+'</select></div>'+
    '<div class="sf-row"><div class="sf"><label>Compte</label><select id="shBank">'+accountOptions(accs.length?accs[0].id:'',true)+'</select></div>'+
    '<div class="sf"><label>Date</label><input type="date" id="shDate" value="'+todayStr()+'"></div></div>'+
    (kind==='rev'?'':'<div class="sf"><label>Nature</label><div class="seg" id="shNeed"><button type="button" data-v="obligatoire" onclick="setSheetNeed(this)">Obligatoire</button><button type="button" data-v="plaisir" onclick="setSheetNeed(this)">Plaisir</button></div></div>')+
    '<button class="sheet-btn" onclick="saveSheetTxn(\''+kind+'\')">'+(kind==='rev'?'Ajouter le revenu':'Ajouter la dépense')+'</button>');
  if(kind!=='rev') sheetCatChanged();
  setTimeout(function(){ document.getElementById('shAmount').focus(); },150);
}
function setSheetNeed(btn){
  sheetNeed=(sheetNeed===btn.getAttribute('data-v'))?'':btn.getAttribute('data-v');
  var bs=document.querySelectorAll('#shNeed button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===sheetNeed);
}
function sheetCatChanged(){
  var box=document.getElementById('shNeed'); if(!box) return;
  var g=getCatObj(document.getElementById('shCat').value).group;
  sheetNeed=(g==='dep'||g==='epargne')?'obligatoire':'';
  var bs=box.querySelectorAll('button');
  for(var i=0;i<bs.length;i++) bs[i].classList.toggle('on',bs[i].getAttribute('data-v')===sheetNeed);
}
function saveSheetTxn(kind){
  var amount=parseFloat(document.getElementById('shAmount').value);
  var label=document.getElementById('shLabel').value.trim();
  var cat=document.getElementById('shCat').value;
  var date=document.getElementById('shDate').value;
  if(!amount||amount<=0){ showToast('Indique un montant'); return; }
  if(!label){ showToast('Indique un libellé'); return; }
  if(!date){ showToast('Indique une date'); return; }
  var g=getCatObj(cat).group;
  var type=kind==='rev'?'rev':((g&&g!=='rev')?g:'dep_var');
  var t={id:Date.now(),date:date,label:label,cat:cat,amount:amount,type:type,bank:document.getElementById('shBank').value,need:kind==='rev'?'':sheetNeed};
  apiPost('/api/transactions',t,function(err){
    if(err){ showToast('Erreur : '+err.message); return; }
    var txns=getTxns(); txns.unshift(t); setTxns(txns); roundAfter(t);
    closeSheet(); refreshViews(); showToast(kind==='rev'?'Revenu ajouté':'Dépense ajoutée');
  });
}

function saveSheetTransfer(){
  var from=document.getElementById('shFrom').value, to=document.getElementById('shTo').value;
  var amount=parseFloat(document.getElementById('shAmount').value);
  var date=document.getElementById('shDate').value;
  var label=document.getElementById('shLabel').value.trim()||('Virement '+accountName(from)+' vers '+accountName(to));
  if(from===to){ showToast('Choisis deux comptes différents'); return; }
  if(!amount||amount<=0){ showToast('Indique un montant'); return; }
  if(!date){ showToast('Indique une date'); return; }
  var now=Date.now();
  var out={id:now,date:date,label:label,cat:'autres_dep',amount:amount,type:'transfert',bank:from,need:'',transferPair:now+1,transfer_pair:now+1};
  var inn={id:now+1,date:date,label:label,cat:'autre_rev',amount:amount,type:'transfert_in',bank:to,need:'',transferPair:now,transfer_pair:now};
  apiPost('/api/transactions/bulk',{transactions:[out,inn]},function(err){
    if(err){ showToast('Erreur : '+err.message); return; }
    var txns=getTxns(); txns.unshift(inn); txns.unshift(out); setTxns(txns);
    closeSheet(); refreshViews(); showToast('Transfert enregistré');
  });
}

// Couleurs : melange avec du blanc (amt>0) ou du noir (amt<0)
function shadeHex(hex,amt){
  var n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255, t=amt<0?0:255, p=Math.abs(amt);
  r=Math.round(r+(t-r)*p); g=Math.round(g+(t-g)*p); b=Math.round(b+(t-b)*p);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function hexLum(hex){ var n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
function hslHex(h,s,l){
  s/=100; l/=100;
  var a=s*Math.min(l,1-l);
  function f(n){ var k=(n+h/30)%12; return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1))); }
  return '#'+[f(0),f(8),f(4)].map(function(x){ return ('0'+Math.round(x*255).toString(16)).slice(-2); }).join('');
}

// Motif propre a chaque banque : tire au hasard mais toujours le meme pour une banque donnee
function seedRng(str){
  var h=2166136261; for(var i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return function(){ h+=0x6D2B79F5; var t=h; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; };
}
// Faisceau de 3 a 5 traits qui partent du bas de la carte et finissent en haut, de meme forme,
// legerement decales (en eventail) : forme, inclinaison et espacement propres a chaque banque
function cvDecoSvg(rnd){
  var W='rgba(255,255,255,', K='rgba(0,0,0,', a=function(lo,hi){ return lo+rnd()*(hi-lo); }, r1=function(v){ return Math.round(v*10)/10; };
  var n=3+Math.floor(rnd()*3), shape=Math.floor(rnd()*3), dir=rnd()<.5?-1:1, bend=a(18,42);
  var k1=shape===2?0:dir*bend, k2=shape===0?-dir*bend:(shape===1?dir*bend:0);
  var xb0=a(38,92), lean=a(-35,45), sb=a(9,17), st=sb*a(.55,1.6);
  var curves=[];
  for(var i=0;i<n;i++){
    var xb=xb0+i*sb, xt=xb0+lean+i*st, f=1+i*.08;
    curves.push('M'+r1(xb)+',100 C'+r1(xb+k1*f)+','+r1(a(58,70))+' '+r1(xt+k2*f)+','+r1(a(30,42))+' '+r1(xt)+',0');
  }
  var g='';
  // bandes claires entre deux traits, et ombre apres le dernier trait
  var band=Math.floor(rnd()*(n-1));
  function rev(d){ // meme courbe parcourue de haut en bas, pour fermer une surface
    var p=d.split(/[ MC]+/).filter(Boolean);
    return ' L'+p[3]+' C'+p[2]+' '+p[1]+' '+p[0];
  }
  g+='<path d="'+curves[band]+rev(curves[band+1])+' Z" fill="'+W+'.07)"/>';
  if(n>3) g+='<path d="'+curves[n-3]+rev(curves[n-2])+' Z" fill="'+W+'.04)"/>';
  g+='<path d="'+curves[n-1]+' L170,0 L170,100 Z" fill="'+K+'.2)"/>';
  for(var c=0;c<n;c++){
    var op=c===band?.5:(.14+rnd()*.22), w=c===band?.7:(.5+rnd()*1.1);
    g+='<path d="'+curves[c]+'" fill="none" stroke="'+W+r1(op*100)/100+')" stroke-width="'+r1(w)+'"/>';
  }
  return '<svg class="cv-deco" viewBox="0 0 160 100" preserveAspectRatio="none">'+g+'</svg>';
}

  var p=accountProjected(acc); if(Math.abs(p-bal)<0.005) return '';
  var per=accountPeriod(acc), pe=parseDs(per.end), lbl=per.pay?'AVANT PAIE':(per.fixed?'AU '+pe.getDate()+' '+MONTHS_ABBR[pe.getMonth()].toUpperCase().replace('.',''):'FIN '+MONTHS_ABBR[new Date().getMonth()].toUpperCase().replace('.',''));

}

function initWheel(){
  var wheel=document.getElementById('wizWheel'), dot=document.getElementById('wizDot'), light=document.getElementById('wizLight');
  function place(){
    var r=wheel.offsetWidth/2, ang=W.h*Math.PI/180, dist=r*W.s/100;
    dot.style.left=(r+Math.sin(ang)*dist)+'px'; dot.style.top=(r-Math.cos(ang)*dist)+'px';
    dot.style.background=W.color;
  }
  function pick(e){
    var rect=wheel.getBoundingClientRect(), r=rect.width/2;
    var dx=e.clientX-rect.left-r, dy=e.clientY-rect.top-r;
    W.h=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;
    W.s=Math.min(100,Math.sqrt(dx*dx+dy*dy)/r*100);
    W.color=hslHex(W.h,W.s,W.l); place(); updateWizCard();
  }
  var dragging=false;
  wheel.addEventListener('pointerdown',function(e){ dragging=true; wheel.setPointerCapture(e.pointerId); pick(e); });
  wheel.addEventListener('pointermove',function(e){ if(dragging) pick(e); });
  wheel.addEventListener('pointerup',function(){ dragging=false; });
  light.oninput=function(){ W.l=parseInt(light.value,10); W.color=hslHex(W.h,W.s,W.l); place(); updateWizCard(); };
  place();
}

function saveRoundCfg(id,cfg){

// Petite monnaie d un achat : 25,60 -> 0,40 ; 18 -> 1 (x le multiplicateur)
function roundUpOf(amount,x){ var a=Math.round(amount*100), r=(100-a%100)%100||100; return Math.round(r*(x||1))/100; }
// Achat saisi a la main sur un compte qui arrondit : on ajoute sa petite monnaie au versement du lundi suivant
function roundAfter(t){
  if(!t||!t.bank||t.type==='rev'||/^transfert/.test(t.type||'')||Number(t.no_balance)) return;
  var cfg=roundCfg(t.bank); if(!cfg) return;
  var amt=roundUpOf(+t.amount,cfg.x), mon=qkMonday(t.date), txns=getTxns(), part={d:t.date,a:amt};
  var ex=txns.filter(function(x){ return x.date===mon&&x.type==='transfert'&&String(x.bank)===String(t.bank)&&/^🪙/.test(x.label||''); })[0];
  if(ex){
    var parts=qkPartsOf(ex.note).concat([part]).sort(function(p,q){ return p.d<q.d?-1:1; }), total=qkSum(parts), note=qkPartsNote(parts);
    var pair=ex.transfer_pair?txns.filter(function(x){ return String(x.id)===String(ex.transfer_pair); })[0]:null;
    [ex,pair].forEach(function(x){ if(!x) return; x.amount=total; x.note=note; apiPost('/api/transactions',x,null); });
    return;
  }
  var now=Date.now()+7, lbl='🪙 Arrondis → '+(findAccount(cfg.to)||{}).name;

// Calendrier de choix : on touche le debut puis la fin ; la periode se repete chaque mois
function amToggleCycle(){
  AM.cycOpen=!AM.cycOpen;
  if(AM.cycOpen){
    var r=AM.cycle?cycleRangeAt(AM.cycle,todayStr()):null;
    AM.rs=r?r.start:''; AM.re=r?r.end:'';
    var d=r?parseDs(r.start):new Date(); AM.cy=d.getFullYear(); AM.cm=d.getMonth();
  }
  amRefreshSettings();
}
function amCycleCal(){
  var y=AM.cy, m=AM.cm, first=(new Date(y,m,1).getDay()+6)%7, dim=daysIn(y,m), today=todayStr();
  var h='<div class="cyc"><div class="cal-head"><button class="cal-nav" onclick="amCycMove(-1)"><svg class="ico" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>'+
    '<b>'+MONTHS_FR[m]+' '+y+'</b><button class="cal-nav" onclick="amCycMove(1)">'+svgIcon('chev')+'</button></div>'+
    '<p class="am-note cyc-help">'+(!AM.rs?'Touche le <b>premier jour</b> de ton mois.':(!AM.re?'Touche maintenant le <b>dernier jour</b>.':'Du <b>'+niceDate(AM.rs).toLowerCase()+'</b> au <b>'+niceDate(AM.re).toLowerCase()+'</b>, puis chaque mois.'))+'</p><div class="cal-grid">';
  var dows=['L','M','M','J','V','S','D'];
  for(var w=0;w<7;w++) h+='<span class="cal-dow">'+dows[w]+'</span>';
  for(var s=0;s<first;s++) h+='<span></span>';
  for(var d=1;d<=dim;d++){
    var ds=mPrefix(y,m)+'-'+pad(d), cls='cal-day';
    if(ds===AM.rs||ds===AM.re) cls+=' on';
    else if(AM.rs&&AM.re&&ds>AM.rs&&ds<AM.re) cls+=' in';
    if(ds===today) cls+=' today';
    h+='<button class="'+cls+'" onclick="amCycPick(\''+ds+'\')">'+d+'</button>';
  }
  // ou suivre une paie (operation reguliere de revenu)
  var pays=getRecurring().filter(function(r){ return r.kind==='rev'; });
  if(pays.length){
    h+='</div><p class="am-note cyc-help">Ou suivre une paie : le mois commence le jour où elle est confirmée.</p><div class="cy-list">';
    pays.forEach(function(r){ h+='<button class="cy-opt'+(String(AM.cycle)===String(r.id)?' on':'')+'" onclick="amSetCycle(\''+r.id+'\')"><b>Selon la paie : '+esc(r.label)+'</b>'+(String(AM.cycle)===String(r.id)?'<i>✓</i>':'')+'</button>'; });
  }
  // un seul lien discret pour revenir au mois normal (du 1er au 31)
  return h+'</div>'+(AM.cycle||AM.rs?'<button class="cyc-reset" onclick="amSetCycle(\'\')">Réinitialiser</button>':'')+'</div>';
}
function amCycMove(n){ var d=new Date(AM.cy,AM.cm+n,1); AM.cy=d.getFullYear(); AM.cm=d.getMonth(); amRefreshSettings(); }
function amCycPick(ds){
  if(!AM.rs||AM.re||ds<AM.rs){ AM.rs=ds; AM.re=''; amRefreshSettings(); return; }
  var len=Math.round((parseDs(ds)-parseDs(AM.rs))/86400000);
  if(len<27||len>31){ showToast('Choisis une fin entre 28 et 32 jours après le début (un mois)'); return; }
  AM.re=ds;
  AM.cycle='r:'+parseDs(AM.rs).getDate()+':'+parseDs(AM.re).getDate();
  amRefreshSettings();
}

function saveAccount(msg){
  var old=findAccount(AM.id); if(!old) return;
  var name=AM.name.trim(), solde=parseFloat(String(AM.solde).replace(',','.'));
  if(!name){ showToast('Donne un nom au compte'); return; }
  if(isNaN(solde)){ showToast('Indique un solde'); return; }
  var re=document.getElementById('amRate');
  if(AM.currency&&AM.currency!==mainCur()){
    var rv=re?parseFloat(String(re.value).replace(',','.')):0;
    if(rv>0) saveRate(AM.currency,rv); else if(!hasRate(AM.currency)){ showToast('Indique le taux de change de cette devise'); return; }
  }
  var acc={id:old.id,name:name,bank:old.bank||'',type:AM.type,description:AM.desc.trim(),color:AM.color,hidden:AM.hidden,cycle:AM.cycle||'',owner:AM.owner||'',currency:AM.currency||'',
    solde:old.solde,soldeDate:old.soldeDate,soldeSetAt:old.soldeSetAt,sortOrder:getAccounts().indexOf(old)};
  // Solde corrige a la main : on repart de ce nouveau solde a partir de maintenant
  if(Math.abs(accountBalance(old)-solde)>=0.005){ acc.solde=solde; acc.soldeDate=todayStr(); acc.soldeSetAt=Date.now(); }
  saveRoundCfg(acc.id,AM.round);
  apiPost('/api/accounts',acc,function(err){
    if(err){ showToast('Erreur : '+err.message); return; }
    var list=getAccounts().slice();
    for(var i=0;i<list.length;i++){ if(String(list[i].id)===String(acc.id)) list[i]=acc; }
    _cache.accounts=list;
    closeAccModal(); refreshViews(); showToast(typeof msg==='string'?msg:'Compte mis à jour');
  });
}
function deleteAccount(id,ok,withOps){
  if(!ok&&!confirm('Supprimer ce compte ? Les transactions déjà saisies sont conservées.')) return;
  apiDelete('/api/accounts/'+id+(withOps?'?ops=1':''),function(err){
    if(err){ showToast('Erreur suppression'); return; }
    var list=getAccounts(), out=[];
    for(var i=0;i<list.length;i++){ if(String(list[i].id)!==String(id)) out.push(list[i]); }
    _cache.accounts=out;
    if(withOps){
      setTxns(getTxns().filter(function(t){ return String(t.bank)!==String(id); }));
      setRecurring(getRecurring().filter(function(r){ return String(r.bank)!==String(id); }));
    }
    closeAccModal(); refreshViews(); showToast(withOps?'Compte et opérations supprimés':'Compte supprimé');
  });
}

// ---------- Detail d une transaction ----------
function openTxnDetail(id){
  var txns=getTxns(), t=null;
  for(var i=0;i<txns.length;i++){ if(String(txns[i].id)===String(id)){ t=txns[i]; break; } }
  if(!t) return;
  var cat=getCatObj(t.cat), kind=txnKind(t);
  var typeLbls={dep:'Dépense fixe',dep_var:'Dépense variable',epargne:'Épargne',rev:'Revenu',transfert:'Virement sortant',transfert_in:'Virement entrant'};
  var p=t.date.split('-');
  var rows=[['Date',parseInt(p[2],10)+' '+MONTHS_FR[parseInt(p[1],10)-1]+' '+p[0]],['Type',typeLbls[t.type]||t.type]];
  if(kind!=='tra') rows.push(['Catégorie',cat.label]);
  if(t.bank) rows.push(['Compte',accountName(t.bank)]);
  if(t.need) rows.push(['Nature',t.need==='plaisir'?'Plaisir':'Obligatoire']);
  if(t.trip) rows.push(['Voyage',t.trip]);
  if(t.note) rows.push(['Note',t.note]);
  if(Number(t.remb)) rows.push(['Remboursement','Quelqu’un me rembourse']);
  if(Number(t.later_pay)) rows.push(['Paiement','À payer plus tard']);
  if(Number(t.no_balance)) rows.push(['Solde','Non affecté']);
  var list='';
  for(var r=0;r<rows.length;r++) list+='<div><span>'+esc(rows[r][0])+'</span><span>'+esc(rows[r][1])+'</span></div>';
  openSheet(sheetHead('Détail')+
    '<div class="detail-top">'+(kind==='tra'?'<span class="tx-icon">⇄</span>':catIconHtml(cat,'tx-icon'))+'<div style="font-size:18px;font-weight:800;">'+esc(t.label)+'</div>'+
    '<div class="detail-amt tx-amt '+kind+'" style="background:none;padding:0;">'+(txnSign(t)>0?'+ ':'– ')+fmtEur(parseFloat(t.amount)||0,bankCur(t.bank))+'</div></div>'+
    '<div class="detail-list">'+list+'</div>'+
    (txnLocked(t)||(kind==='tra'&&txnLocked(pairOf(t)))?lockNote(t.type==='transfert_in'?pairOf(t).bank:t.bank):
    (Number(t.later_pay)?'<button class="sheet-btn" onclick="markTxnPaid(\''+Number(t.id)+'\')">Marquer comme payée</button>':'')+
    '<button class="sheet-btn ghost" onclick="deleteHomeTxn('+("'"+Number(t.id)+"'")+')">Supprimer'+(kind==='tra'?' le transfert':'')+'</button>'));
}
function deleteHomeTxn(id){
  if(!confirm('Supprimer cette transaction ?')) return;
  var txns=getTxns(), t=null;
  for(var i=0;i<txns.length;i++){ if(String(txns[i].id)===String(id)){ t=txns[i]; break; } }
  if(!t) return;
  // Un transfert = deux lignes : on supprime les deux
  var ids=[String(t.id)], pair=t.transfer_pair||t.transferPair;
  if(pair) ids.push(String(pair));
  var left=ids.length;
  for(var k=0;k<ids.length;k++){
    apiDelete('/api/transactions/'+ids[k],function(){
      if(--left>0) return;
      var out=[]; for(var j=0;j<txns.length;j++){ if(ids.indexOf(String(txns[j].id))<0) out.push(txns[j]); }
      setTxns(out); closeSheet(); refreshViews(); showToast('Supprimé');
    });
  }
}

var STMT_PREFIX=['cb','carte','paiement','paiement par carte','achat','prlv','prlv sepa','prelevement','sepa','vir','virement','facture carte','retrait','x'];
function normKey(v){ return normTxt(v).replace(/[^a-z0-9]+/g,' ').trim(); }
var _brands=null;
// Toutes les enseignes connues : magasins + abonnements, avec leurs autres noms
function brandList(){
  if(_brands) return _brands;
  var out=[], seen={};
  function add(m){
    var k=normKey(m[0]); if(seen[k]) return; seen[k]=1;
    var keys=[k].concat((MERCHANT_ALIASES[m[0]]||[]).map(normKey));
    out.push({name:m[0],cat:m[1],m:m,keys:keys});
  }
  MERCHANTS.forEach(add);
  (typeof SUB_BRANDS!=='undefined'?SUB_BRANDS:[]).forEach(function(b){
    add([b[0],b[1],'#efe6d8',b[0].replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase(),'#6b5a3c']);
  });
  return (_brands=out);
}
// Enseigne d un libelle : le libelle commence par le nom (ou un autre nom) de l enseigne, le plus long gagne
function findMerchant(name){
  var n=normKey(name); if(!n) return null;
  for(var again=true;again;){
    again=false;
    for(var p=0;p<STMT_PREFIX.length;p++){ var px=STMT_PREFIX[p]+' '; if(n.indexOf(px)===0&&n.length>px.length){ n=n.slice(px.length); again=true; } }
    n=n.replace(/^\d+ /,'');
  }
  var best=null, bestLen=0, bs=brandList();
  for(var i=0;i<bs.length;i++){
    for(var j=0;j<bs[i].keys.length;j++){
      var k=bs[i].keys[j];
      if(!k||k.length<=bestLen) continue;
      if(n===k||(k.length>=3&&n.indexOf(k+' ')===0)){ best=bs[i].m; bestLen=k.length; }
    }
  }
  return best;
}

// ---------- Suggestions de noms pendant la saisie ----------
// Les noms deja utilises (les plus frequents d abord), puis les enseignes connues (depenses seulement)
var SUGG=[];
function suggMatch(k,n){ return !n||k.indexOf(n)===0||k.indexOf(' '+n)>=0; }
function nameSuggestions(q,kind){
  var n=normKey(q), out=[], seen={}, txns=getTxns(), freq={}, last={};
  function add(name,cat,m,hist){ var k=normKey(name); if(!k||seen[k]||k===n) return; seen[k]=1; out.push({name:name,cat:cat,m:m,hist:hist}); }
  for(var i=0;i<txns.length;i++){
    var t=txns[i], ok=kind==='rev'?t.type==='rev':(t.type==='dep'||t.type==='dep_var'||t.type==='epargne');
    if(!ok) continue;
    var k=normKey(t.label); if(!k) continue;
    freq[k]=(freq[k]||0)+1;
    if(!last[k]||t.date>last[k].date) last[k]=t;
  }
  Object.keys(freq).filter(function(k){ return suggMatch(k,n); }).sort(function(a,b){ return freq[b]-freq[a]; })
    .slice(0,n?4:5).forEach(function(k){ add(last[k].label,last[k].cat,findMerchant(last[k].label),true); });
  if(kind!=='rev'&&n){
    var bs=brandList().filter(function(b){ return b.keys.some(function(k){ return suggMatch(k,n); }); });
    bs.sort(function(a,b){ return (b.keys[0].indexOf(n)===0)-(a.keys[0].indexOf(n)===0)||a.name.localeCompare(b.name); });
    bs.forEach(function(b){ add(b.name,b.cat,b.m,false); });
  }
  return out.slice(0,7);
}
function suggIcon(s){
  if(s.m&&LOGOS['m:'+s.m[0]]) return '<span class="sugg-ic img"><img src="'+LOGOS['m:'+s.m[0]]+'" alt=""></span>';

}
function showSugg(input,kind){
  var box=document.getElementById('expSugg'); if(!box) return;

  if(!SUGG.length){ box.classList.remove('open'); box.innerHTML=''; return; }
  var html='', part='';
  for(var i=0;i<SUGG.length;i++){

    if(h!==part){ html+='<div class="sugg-h">'+h+'</div>'; part=h; }

      '<span class="sugg-txt"><span class="sugg-name">'+esc(s.name)+'</span>'+(cat&&s.cat?'<span class="sugg-sub">'+esc(cat.label)+'</span>':'')+'</span></button>';
  }
  box.innerHTML=html; box.classList.add('open');
}
function hideSugg(){ var box=document.getElementById('expSugg'); if(box) box.classList.remove('open'); }
function catUsable(key,kind){
  if(!key) return false;
  if(kind==='rev') return !!(findIncCat(key)||getCats().some(function(c){ return c.key===key&&c.group==='rev'; }));
  return !!(findExpCat(key)||customExpCats().some(function(c){ return c.key===key; }));
}
function pickSugg(i,kind){
  var s=SUGG[i]; if(!s||!E) return;
  E.label=s.name;
  var li=document.getElementById('expLabel'); if(li){ li.value=s.name; li.blur(); }
  hideSugg();
  if(catUsable(s.cat,kind)){ E.cat=s.cat; E.catManual=true; if(kind==='rev') renderIncTiles(); else markExpCat(true); }
}
// Enseigne reconnue pendant la saisie : on choisit sa categorie si l utilisateur n en a pas choisi
// Categories les plus probables pour un nom : enseigne connue, puis ce qui a deja ete choisi pour un nom proche,
// puis les categories les plus utilisees ces 6 derniers mois
function catSuggest(label,rev,n){
  var kind=rev?'rev':'dep', q=normTxt(label||'').trim(), w=q.split(/\s+/)[0]||'', sc={}, since=addDays(todayStr(),-180), strong={};
  function add(k,v,st){ if(!k||!catUsable(k,kind)) return; sc[k]=(sc[k]||0)+v; if(st) strong[k]=1; }
  if(!rev&&q){ var m=findMerchant(label); if(m) add(m[1],50,true); }
  getTxns().forEach(function(t){
    if(txnKind(t)!==kind) return;
    var l=normTxt(t.label||'').trim();
    if(q){ if(l===q) add(t.cat,20,true); else if(w.length>=3&&l.indexOf(w)===0) add(t.cat,6,true); else if(q.length>=3&&l.indexOf(q)>=0) add(t.cat,4,true); }
    if(t.date>=since) add(t.cat,0.2);
  });
  var keys=Object.keys(sc).sort(function(a,b){ return sc[b]-sc[a]; }).slice(0,n||6);
  keys.best=keys.length&&strong[keys[0]]?keys[0]:null;
  return keys;
}
// Rangee « Les plus probables » en haut des categories (saisie d une depense ou d un revenu)
function renderCatSugg(rev){
  var el=document.getElementById('catSugg'); if(!el||!E) return;
  if(rev&&E.incQ){ el.innerHTML=''; return; }
  var keys=catSuggest(E.label,rev,rev?4:6);
  el.innerHTML=keys.length?'<div class="cs-h">'+(normTxt(E.label||'').trim()?'Les plus probables pour « '+esc(E.label.trim())+' »':'Les plus utilisées')+'</div><div class="cs-row">'+
    keys.map(function(k){ var c=getCatObj(k); return '<button class="cat-tile'+(E.cat===k?' on':'')+'" data-k="'+esc(k)+'" onclick="expPickCat(this)">'+catIconHtml(c,'cat-ic')+esc(c.label)+'</button>'; }).join('')+'</div>':'';
}
function autoCatFromName(rev){
  if(!E) return;
  renderCatSugg(rev);
  if(E.catManual) return;
  var b=catSuggest(E.label,rev,1).best;
  if(b&&E.cat!==b){ E.cat=b; if(rev) renderIncTiles(); else markExpCat(false); renderCatSugg(rev); }
}
function bindNameInput(li,kind){

function renderAccStep(title,key,accs){
